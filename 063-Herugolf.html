  font-family:"Noto Sans TC","Nunito",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif
}

button{
  font-family:inherit
}

.board-touch{
  touch-action:none;
  -moz-user-select:none;
       user-select:none;
  -webkit-user-select:none
}

@keyframes fall{
  0%{
    transform:translateY(-20px) rotate(0deg);
    opacity:1
  }

  100%{
    transform:translateY(520px) rotate(540deg);
    opacity:.9
  }
}

@keyframes pop{
  0%{
    transform:scale(.92);
    opacity:0
  }

  100%{
    transform:scale(1);
    opacity:1
  }
}

@keyframes pulse-ring{
  0%{
    box-shadow:0 0 0 0 rgba(242,183,5,.55)
  }

  100%{
    box-shadow:0 0 0 10px rgba(242,183,5,0)
  }
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-4px)
  }
}

.confetti{
  animation:fall 2.8s ease-in forwards
}

.modal-pop{
  animation:pop .22s ease-out
}

.floaty{
  animation:floaty 3s ease-in-out infinite
}

.hint-pulse{
  animation:pulse-ring 1.1s ease-out infinite
}

input,button{
  outline:none
}

button:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:2px
}

@media (min-width: 640px) {
  .sm\:inline {
    display: inline;
  }

  .sm\:h-\[60px\] {
    height: 60px;
  }

  .sm\:w-\[60px\] {
    width: 60px;
  }

  .sm\:p-4 {
    padding: 1rem;
  }

  .sm\:p-6 {
    padding: 1.5rem;
  }

  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:pt-6 {
    padding-top: 1.5rem;
  }

  .sm\:text-\[12px\] {
    font-size: 12px;
  }

  .sm\:text-\[13px\] {
    font-size: 13px;
  }

  .sm\:text-\[30px\] {
    font-size: 30px;
  }
}

@media (min-width: 1024px) {
  .lg\:grid {
    display: grid;
  }

  .lg\:grid-cols-\[minmax\(0\2c 1fr\)_300px\] {
    grid-template-columns: minmax(0,1fr) 300px;
  }

  .lg\:gap-3 {
    gap: 0.75rem;
  }
}
