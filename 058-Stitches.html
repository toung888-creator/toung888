:root{
  --bg:#FFF6E8;
  --surface:#FFFEFA;
  --surface-2:#FDF0D9;
  --ink:#4A3528;
  --muted:#8A6F5E;
  --line:#EAD9C2;
  --primary:#FF6B9D;
  --primary-2:#FFB3C7;
  --accent:#2EC4B6;
  --wood:#A06A3B;
  --wood-2:#7A4A22;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#2B211A;
    --surface:#3A2D23;
    --surface-2:#46362A;
    --ink:#FFF1DC;
    --muted:#D9BFA6;
    --line:#5A4636;
    --primary:#FF8FAB;
    --primary-2:#6E3A4D;
    --accent:#6EDDD2;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Sans TC","Baloo 2",system-ui,sans-serif
}

.font-display{
  font-family:"Baloo 2","Noto Sans TC",sans-serif
}

.fabric{
  background-color:#F7E9CF;
  background-image:
    repeating-linear-gradient(0deg, rgba(120,72,20,.055) 0 1px, transparent 1px 6px),
    repeating-linear-gradient(90deg, rgba(120,72,20,.055) 0 1px, transparent 1px 6px),
    radial-gradient(circle at 30% 20%, rgba(255,255,255,.7), transparent 42%),
    radial-gradient(circle at 75% 80%, rgba(214,164,102,.28), transparent 40%);
}

.fabric-dark{
  background-color:#EAD9B8;
}

.wood{
  background: conic-gradient(from 18deg, #C68B4E, #8A4E22, #D9A765, #7A451F, #B87A3F, #9A5A28, #C68B4E);
  box-shadow: 0 18px 40px rgba(90,45,10,.28), inset 0 2px 3px rgba(255,255,255,.55), inset 0 -4px 8px rgba(60,30,5,.28);
}

.wood-screw{
  box-shadow: inset 0 1px 2px rgba(255,255,255,.8), 0 1px 2px rgba(0,0,0,.25);
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  box-shadow:0 10px 28px rgba(90,50,15,.08);
}

.chip{
  border:1px solid var(--line);
  background:var(--surface);
}

@keyframes pulseDot{
  0%,100%{
    transform:scale(1);
    opacity:1
  }

  50%{
    transform:scale(1.55);
    opacity:.55
  }
}

@keyframes shakeX{
  0%,100%{
    transform:translateX(0)
  }

  20%{
    transform:translateX(-7px)
  }

  40%{
    transform:translateX(6px)
  }

  60%{
    transform:translateX(-4px)
  }

  80%{
    transform:translateX(3px)
  }
}

@keyframes floatY{
  0%,100%{
    transform:translateY(0) rotate(-2deg)
  }

  50%{
    transform:translateY(-7px) rotate(3deg)
  }
}

@keyframes popIn{
  0%{
    transform:scale(.7);
    opacity:0
  }

  100%{
    transform:scale(1);
    opacity:1
  }
}

@keyframes confettiFall{
  0%{
    transform:translateY(-20px) rotate(0deg);
    opacity:1
  }

  100%{
    transform:translateY(430px) rotate(620deg);
    opacity:.1
  }
}

@keyframes needleBob{
  0%,100%{
    transform:translateY(0) rotate(-8deg)
  }

  50%{
    transform:translateY(-5px) rotate(4deg)
  }
}

@keyframes threadDash{
  to{
    stroke-dashoffset:-14
  }
}

.animate-pulse-dot{
  animation:pulseDot 1s infinite
}

.animate-shake{
  animation:shakeX .45s ease
}

.animate-float{
  animation:floatY 3.2s ease-in-out infinite
}

.animate-pop{
  animation:popIn .28s ease both
}

.animate-needle{
  animation:needleBob 2.2s ease-in-out infinite
}

.confetti-piece{
  position:absolute;
  top:-12px;
  animation:confettiFall linear infinite;
  border-radius:2px
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

.no-scrollbar{
  scrollbar-width:none
}

button{
  -webkit-tap-highlight-color: transparent;
}

svg text{
  font-family:"Baloo 2","Noto Sans TC",sans-serif
}

.hover\:-translate-y-0\.5:hover {
  --tw-translate-y: -0.125rem;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.disabled\:opacity-40:disabled {
  opacity: 0.4;
}

@media (min-width: 640px) {
  .sm\:-left-4 {
    left: -1rem;
  }

  .sm\:block {
    display: block;
  }

  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:gap-3 {
    gap: 0.75rem;
  }

  .sm\:p-3 {
    padding: 0.75rem;
  }

  .sm\:p-4 {
    padding: 1rem;
  }

  .sm\:p-5 {
    padding: 1.25rem;
  }

  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }

  .sm\:text-2xl {
    font-size: 1.5rem;
    line-height: 2rem;
  }

  .sm\:text-xs {
    font-size: 0.75rem;
    line-height: 1rem;
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[1fr_340px\] {
    grid-template-columns: 1fr 340px;
  }
}
