:root {
  --bg-paper: #c89b6a;
  --bg-card: #d9b98a;
  --board-bg: #f5e6c8;
  --line: #c9a86a;
  --line-strong: #6b4423;
  --ink: #4a2c0a;
  --ink-soft: #6b4423;
  --accent: #6b4423;
  --accent-2: #8b5a2b;
  --wood-table:
    repeating-linear-gradient(93deg, rgba(169,113,63,0.18) 0px, rgba(169,113,63,0.18) 2px, transparent 2px, transparent 14px),
    repeating-linear-gradient(88deg, rgba(217,177,137,0.22) 0px, rgba(217,177,137,0.22) 3px, transparent 3px, transparent 31px),
    repeating-linear-gradient(91deg, rgba(90,58,30,0.10) 0px, rgba(90,58,30,0.10) 1px, transparent 1px, transparent 47px),
    linear-gradient(100deg, #d9b189 0%, #c89b6a 28%, #b5834e 52%, #c89b6a 74%, #a9713f 100%);
  --wood-frame:
    repeating-linear-gradient(90deg, rgba(63,39,18,0.20) 0px, rgba(63,39,18,0.20) 2px, transparent 2px, transparent 18px),
    repeating-linear-gradient(90deg, rgba(217,177,137,0.18) 0px, rgba(217,177,137,0.18) 3px, transparent 3px, transparent 29px),
    linear-gradient(135deg, #a9713f 0%, #8b5a2b 38%, #6b4423 62%, #8b5a2b 100%);
  --wood-panel:
    repeating-linear-gradient(90deg, rgba(169,113,63,0.14) 0px, rgba(169,113,63,0.14) 2px, transparent 2px, transparent 22px),
    linear-gradient(180deg, #e8d5a8 0%, #d9b98a 55%, #cfa875 100%);
  --wood-btn:
    repeating-linear-gradient(90deg, rgba(63,39,18,0.14) 0px, rgba(63,39,18,0.14) 2px, transparent 2px, transparent 16px),
    linear-gradient(180deg, #c49a68 0%, #a67c52 55%, #8b5a2b 100%);
  --wood-btn-dark:
    repeating-linear-gradient(45deg, rgba(0,0,0,0.14) 0px, rgba(0,0,0,0.14) 3px, transparent 3px, transparent 9px),
    linear-gradient(180deg, #7a4a1e 0%, #6b4423 55%, #3f2712 100%);
  --wood-clue:
    repeating-linear-gradient(90deg, rgba(169,113,63,0.12) 0px, rgba(169,113,63,0.12) 2px, transparent 2px, transparent 18px),
