@keyframes floatY{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-8px)
  }
}

@keyframes pulseRing{
  0%{
    box-shadow:0 0 0 0 rgba(45,212,191,.65),0 0 26px rgba(45,212,191,.45)
  }

  100%{
    box-shadow:0 0 0 14px rgba(45,212,191,0),0 0 26px rgba(45,212,191,.15)
  }
}

@keyframes shakeX{
  0%,100%{
    transform:translateX(0)
  }

  20%{
    transform:translateX(-7px)
  }

  40%{
    transform:translateX(6px)
  }

  60%{
    transform:translateX(-4px)
  }

  80%{
    transform:translateX(3px)
  }
}

@keyframes popIn{
  0%{
    transform:scale(.82);
    opacity:0
  }

  100%{
    transform:scale(1);
    opacity:1
  }
}

@keyframes riseIn{
  from{
    transform:translateY(14px);
    opacity:0
  }

  to{
    transform:translateY(0);
    opacity:1
  }
}

@keyframes hintPulse{
  0%,100%{
    transform:scale(1);
    box-shadow:0 0 0 0 rgba(251,191,36,.75)
  }

  50%{
    transform:scale(1.07);
    box-shadow:0 0 0 10px rgba(251,191,36,0)
  }
}

@keyframes confettiFall{
  0%{
    transform:translateY(-10vh) rotate(0deg);
    opacity:1
  }

  100%{
    transform:translateY(105vh) rotate(720deg);
    opacity:.2
  }
}

@keyframes shimmer{
  0%{
    background-position:0% 50%
  }

  100%{
    background-position:200% 50%
  }
}

@keyframes flashRed{
  0%{
    background:rgba(251,113,133,.35)
  }

  100%{
    background:transparent
  }
}

@keyframes breathe{
  0%,100%{
    opacity:.55
  }

  50%{
    opacity:1
  }
}

.anim-pop{
  animation:popIn .28s cubic-bezier(.2,1.4,.4,1) both
}

.anim-rise{
  animation:riseIn .45s ease both
}

.shake{
  animation:shakeX .38s ease
}

.pulse-current{
  animation:pulseRing 1.35s ease-in-out infinite
}

.hint-pulse{
  animation:hintPulse .6s ease-in-out infinite
}

.float-slow{
  animation:floatY 5s ease-in-out infinite
}

.confetti{
  animation:confettiFall linear infinite
}

.breathe{
  animation:breathe 2.2s ease-in-out infinite
}
