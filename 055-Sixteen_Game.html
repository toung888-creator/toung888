        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap');
        :root {
          --bg: #FDF6E3;
          --bg-paper: #FAF0D0;
          --fg: #3E2723;
          --fg-muted: #8D6E63;
          --fg-soft: #BC9A7A;
          --surface: rgba(253,246,227,0.92);
          --surface-2: #FFF8E7;
          --border: #D7C4A5;
          --border-strong: #A67C52;
          --wood-dark: #654321;
          --wood-mid: #8B5A2B;
          --wood-light: #D2B48C;
          --wood-cream: #F5DEB3;
          --accent: #8B5A2B;
          --accent-2: #A0522D;
          --accent-fg: #FFF8E7;
          --gap: ${zi};
          --frame-highlight: rgba(255,248,231,0.55);
          --frame-shadow: rgba(50,24,8,0.55);
        }
        body { background: var(--bg); }
        * { font-family: "Noto Sans TC", ui-sans-serif, system-ui; }
        .serif { font-family: "Noto Serif TC", ui-serif, serif; }
        .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
        /* warm linen paper background with subtle wood grain */
        .paper-bg {
          background-color: #FDF6E3;
          background-image:
            repeating-linear-gradient(0deg, rgba(139,90,43,0.03) 0 1px, transparent 1px 18px),
            repeating-linear-gradient(90deg, rgba(139,90,43,0.025) 0 1px, transparent 1px 22px),
            radial-gradient(1200px 600px at 15% -10%, rgba(210,180,140,0.35), transparent 60%),
            radial-gradient(900px 500px at 85% 110%, rgba(160,82,45,0.12), transparent 65%),
            linear-gradient(180deg, #FDF6E3 0%, #FAEBD0 100%);
        }
        /* wood frame - walnut / oak simulation */
        .wood-frame-outer {
          position: relative;
          background:
            linear-gradient(180deg, rgba(255,248,231,0.28) 0%, rgba(255,255,255,0) 18%, rgba(0,0,0,0.18) 100%),
            linear-gradient(90deg, rgba(255,248,231,0.18) 0%, transparent 12%, transparent 88%, rgba(0,0,0,0.22) 100%),
            repeating-linear-gradient(90deg,
              #9C6B3A 0px, #8B5A2B 14px, #A67C52 26px, #7A4A26 38px, #8B5A2B 52px, #9D6E3E 66px, #8B5A2B 80px
            ),
            linear-gradient(180deg, #A67C52 0%, #8B5A2B 22%, #6B3A1F 78%, #4A2510 100%);
          border-radius: 22px;
          padding: 14px;
          box-shadow:
            inset 0 1px 0 0 var(--frame-highlight),
            inset 0 -2px 0 1px rgba(0,0,0,0.35),
            inset 0 0 0 1px #3E1F0D,
            0 18px 40px rgba(101,67,33,0.32),
            0 6px 14px rgba(62,39,35,0.22),
            0 1px 0 rgba(255,248,231,0.6);
        }
        .wood-frame-outer::before {
          content: "";
          position: absolute;
          inset: 0;
          border-radius: 22px;
          background:
            repeating-linear-gradient(0deg, rgba(0,0,0,0.06) 0 1px, transparent 1px 9px),
            repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 28px);
          pointer-events: none;
          mix-blend-mode: multiply;
          opacity: 0.6;
        }
        .wood-frame-inner {
          position: relative;
          border-radius: 14px;
          background:
            linear-gradient(180deg, rgba(0,0,0,0.28), rgba(0,0,0,0.05) 14%),
            repeating-linear-gradient(90deg, #3E2723 0 2px, #4A2E1A 2px 20px, #3E2723 20px 22px),
            linear-gradient(180deg, #2C1A10 0%, #4A2E1A 100%);
          padding: 12px;
          box-shadow:
            inset 0 8px 18px rgba(0,0,0,0.55),
            inset 0 1px 0 rgba(255,255,255,0.08),
            inset 0 -1px 0 rgba(0,0,0,0.8);
        }
        /* brass/wood arrow buttons */
        .wood-arrow {
          position: relative;
          background:
            radial-gradient(120% 120% at 30% 20%, #FFF2CC 0%, #E9C891 18%, #D2B48C 42%, #A67C52 78%, #8B5A2B 100%);
          border: 1px solid #6B3A1F;
          color: #3E1F0D;
          box-shadow:
            inset 0 1px 0 rgba(255,248,231,0.85),
            inset 0 -2px 0 rgba(90,45,15,0.5),
            0 2px 4px rgba(62,31,13,0.35),
            0 1px 0 rgba(255,255,255,0.6);
          font-weight: 800;
          transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
        }
        .wood-arrow::after {
          content: "";
          position: absolute;
          inset: 0;
          border-radius: inherit;
          background: repeating-linear-gradient(90deg, rgba(0,0,0,0.04) 0 1px, transparent 1px 10px);
          pointer-events: none;
          opacity: 0.5;
        }
        .wood-arrow:hover {
          transform: translateY(-1px);
          box-shadow:
            inset 0 1px 0 rgba(255,248,231,0.9),
            inset 0 -2px 0 rgba(90,45,15,0.55),
            0 4px 10px rgba(62,31,13,0.4);
          filter: brightness(1.06);
        }
        .wood-arrow:active {
          transform: translateY(0px) scale(0.97);
          box-shadow:
            inset 0 2px 6px rgba(62,31,13,0.5),
            inset 0 1px 0 rgba(0,0,0,0.2);
        }
        /* wooden tiles */
        .tile-walnut {
          background:
            linear-gradient(180deg, rgba(255,248,231,0.32) 0%, rgba(255,255,255,0) 26%, rgba(0,0,0,0.22) 100%),
            repeating-linear-gradient(90deg, #A67C52 0px, #8B5A2B 12px, #9D6E3E 20px, #7A4A26 32px, #8B5A2B 44px),
            linear-gradient(180deg, #A67C52 0%, #8B5A2B 55%, #6B3A1F 100%);
          border: 1px solid #5A3215;
        }
        .tile-maple {
          background:
            linear-gradient(180deg, rgba(255,255,255,0.6) 0%, rgba(255,248,231,0.15) 22%, rgba(0,0,0,0.12) 100%),
            repeating-linear-gradient(90deg, #F5DEB3 0px, #E9C891 14px, #F0D5A0 26px, #D2B48C 38px, #E9C891 52px),
            linear-gradient(180deg, #FFF0C0 0%, #F5DEB3 50%, #E9C891 100%);
          border: 1px solid #C9A86A;
        }
        .tile-shadow {
          box-shadow:
            inset 0 1px 0 rgba(255,248,231,0.75),
            inset 0 -2px 0 rgba(62,31,13,0.38),
            inset 0 0 0 1px rgba(255,248,231,0.18),
            0 4px 8px rgba(62,31,13,0.32),
            0 1px 2px rgba(62,31,13,0.28);
        }
        .tile-maple-glow {
          box-shadow:
            inset 0 1px 0 rgba(255,255,255,0.85),
            inset 0 -2px 0 rgba(139,90,43,0.25),
            0 0 0 1px #E8C86A,
            0 0 0 3px rgba(232,200,106,0.35),
            0 0 18px rgba(212,160,23,0.35),
            0 5px 12px rgba(101,67,33,0.28);
        }
        .tile-lift:hover {
          transform: translateY(-2px) scale(1.02);
          box-shadow:
            inset 0 1px 0 rgba(255,248,231,0.85),
            inset 0 -2px 0 rgba(62,31,13,0.4),
            0 8px 18px rgba(62,31,13,0.38),
            0 3px 6px rgba(62,31,13,0.3);
        }
        .tile-maple.tile-lift:hover {
          box-shadow:
            inset 0 1px 0 rgba(255,255,255,0.9),

            0 0 0 3px rgba(232,200,106,0.45),
            0 0 22px rgba(212,160,23,0.45),
            0 10px 20px rgba(101,67,33,0.32);
        }
        .engraved {
          color: #2C1A0F;

          filter: drop-shadow(0 0.5px 0 rgba(255,255,255,0.2));
        }
        .wood-panel {
          background:
            linear-gradient(180deg, rgba(255,255,255,0.7) 0%, rgba(253,246,227,0.92) 100%),
