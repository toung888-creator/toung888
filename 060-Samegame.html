}

}

.backdrop-blur-\[2px\]{
  --tw-backdrop-blur: blur(2px);
  backdrop-filter: var(--tw-backdrop-blur) var(--tw-backdrop-brightness) var(--tw-backdrop-contrast) var(--tw-backdrop-grayscale) var(--tw-backdrop-hue-rotate) var(--tw-backdrop-invert) var(--tw-backdrop-opacity) var(--tw-backdrop-saturate) var(--tw-backdrop-sepia);

:root{
  --bg:#FFF6EC;
  --surface:#FFFFFF;
  --surface-2:#FFF1DC;
  --ink:#221E28;
  --muted:#7A6F66;
  --line:#F0DCC5;
  --primary:#FF4D6D;
  --primary-dark:#E02E52;
  --accent:#FFB020;
  --teal:#14B8A6;
  --shadow:0 18px 45px rgba(64,32,12,.10);
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#191320;
    --surface:#251D30;
    --surface-2:#2F263B;
    --ink:#FFF5EA;
    --muted:#C3B6C8;
    --line:#423752;
    --primary:#FF6B8A;
    --primary-dark:#FF87A0;
    --accent:#FFC24B;
    --shadow:0 18px 45px rgba(0,0,0,.35);
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif
}

.font-num{
  font-family:"Fredoka","Noto Sans TC",sans-serif
}

button{
  font-family:inherit
}

@keyframes tilePulse{
  0%,100%{
    transform:scale(1.04)
  }

  50%{
    transform:scale(1.10)
  }
}

@keyframes floatUp{
  0%{
    opacity:0;
    transform:translate(-50%,0) scale(.8)
  }

  18%{
    opacity:1;
    transform:translate(-50%,-10px) scale(1.08)
  }

  100%{
    opacity:0;
    transform:translate(-50%,-46px) scale(1)
  }
}

@keyframes popIn{
  0%{
    opacity:0;
    transform:scale(.7)
  }

  100%{
    opacity:1;
    transform:scale(1)
  }
}

@keyframes shakeX{
  0%,100%{
    transform:translateX(0)
  }

  25%{
    transform:translateX(-4px)
  }

  75%{
    transform:translateX(4px)
  }
}

@keyframes badgeIn{
  from{
    opacity:0;
    transform:translate(-50%,6px)
  }

  to{
    opacity:1;
    transform:translate(-50%,0)
  }
}

@keyframes removingPop{
  0%{
    transform:scale(1)
  }

  45%{
    transform:scale(1.16) rotate(2deg)
  }

  100%{
    transform:scale(.2);
    opacity:0
  }
}

.tile-selected{
  animation:tilePulse .72s ease-in-out infinite
}

.tile-removing{
  animation:removingPop .16s ease-in forwards
}

.float-score{
  animation:floatUp 1s ease-out forwards
}

.pop-in{
  animation:popIn .28s ease-out both
}

.shake{
  animation:shakeX .28s ease-in-out 2
}

.badge-in{
  animation:badgeIn .18s ease-out both
}

.board-scroll::-webkit-scrollbar{
  height:6px
}

.board-scroll::-webkit-scrollbar-thumb{
  background:var(--line);
  border-radius:99px
}

.disabled\:opacity-40:disabled{
  opacity: 0.4;
}

@media (min-width: 640px){
  .sm\:block{
    display: block;
  }

  .sm\:inline{
    display: inline;
  }

  .sm\:flex{
    display: flex;
  }

  .sm\:flex-row{
    flex-direction: row;
  }

  .sm\:justify-center{
    justify-content: center;
  }

  .sm\:gap-6{
    gap: 1.5rem;
  }

  .sm\:p-5{
    padding: 1.25rem;
  }

  .sm\:p-6{
    padding: 1.5rem;
  }

  .sm\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:pt-9{
    padding-top: 2.25rem;
  }

  .sm\:text-\[16px\]{
    font-size: 16px;
  }

  .sm\:text-\[58px\]{
    font-size: 58px;
  }
}

@media (min-width: 1024px){
  .lg\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[1\.35fr_1fr\]{
    grid-template-columns: 1.35fr 1fr;
  }

  .lg\:flex-row{
    flex-direction: row;
  }

  .lg\:items-center{
    align-items: center;
  }

  .lg\:justify-between{
    justify-content: space-between;
  }
}
