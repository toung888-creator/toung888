          0% { transform: scale(0.22) translateY(14px) rotateX(18deg); opacity:0; filter: brightness(1.25) blur(0.5px); }
          55% { transform: scale(1.12) translateY(-4px) rotateX(0deg); filter: brightness(1.05); }
          100% { transform: scale(1) translateY(0); opacity:1; }
        }
        @keyframes popWood {
          0% { transform: scale(1) translateY(0); filter: brightness(1); }
          18% { transform: scale(0.96) translateY(1px); }
          48% { transform: scale(1.15) translateY(-6px); box-shadow: 0 18px 28px rgba(0,0,0,0.45); }
          72% { transform: scale(0.98) translateY(1px); }
          100% { transform: scale(1) translateY(0); }
        }
        @keyframes floatUp {
          0% { transform: translate(-50%, 0) scale(0.8); opacity:0 }
          12% { opacity:1; transform: translate(-50%, -6px) scale(1.08) }
          100% { transform: translate(-50%, -64px) scale(0.86); opacity:0 }
        }
        @keyframes thudShadow {
          0% { box-shadow: 0 7px 0 #000, 0 12px 20px rgba(0,0,0,0.4); }
          50% { box-shadow: 0 12px 0 #000, 0 22px 32px rgba(0,0,0,0.55); }
          100% { box-shadow: 0 7px 0 #000, 0 12px 20px rgba(0,0,0,0.4); }
        }

        /* Board frame thick dark walnut #4a2e18 with grain and bevel 12px */
        .board-outer-frame {
          background:
            repeating-linear-gradient(90deg,
              #4a2e18 0px, #4a2e18 8px,
              #5a3a22 8px, #5a3a22 16px,
              #3d2312 16px, #3d2312 22px,
              #4a2e18 22px, #4a2e18 38px
            ),
            linear-gradient(180deg, #5e3a22 0%, #4a2e18 18%, #3d2312 55%, #2f1d0e 100%);
          border-radius: 26px;
          padding: 14px;
          position: relative;
          border: 1px solid #1e120a;
          box-shadow:
            inset 0 1px 0 rgba(255,255,255,0.18),
            inset 0 12px 0 rgba(255,255,255,0.06),
            inset 0 -12px 0 rgba(0,0,0,0.42),
            inset 0 0 0 1px rgba(255,255,255,0.08),
            0 1px 0 #2f1d0e,
            0 4px 0 #1e120a,
            0 10px 0 #120c06,
            0 22px 36px rgba(0,0,0,0.55),
            0 36px 56px rgba(0,0,0,0.32);
        }
        .board-outer-frame::before {
          content:'';
          position:absolute;
          inset:0;
          border-radius:26px;
          background: repeating-linear-gradient(0deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 22px);
          pointer-events:none;
          opacity:0.5;
        }
        /* inner brass inlay line */
        .board-brass-inlay {
          border: 2px solid #d4af37;
          border-radius: 18px;
          box-shadow:
            inset 0 0 0 1px #8a6d3b,
            inset 0 1px 0 rgba(255,255,255,0.35),
            inset 0 -1px 0 rgba(0,0,0,0.6),
            0 0 0 2px #1a1008,
            0 0 12px rgba(212,175,55,0.25);
          background:
            linear-gradient(180deg, #3a2314 0%, #2f1d0e 100%);
          padding: 12px;
          position:relative;
        }
        .board-inner-board {
          background:
            radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.06) 0%, transparent 60%),
            linear-gradient(180deg, #2f1d0e 0%, #1e120a 100%);
          border-radius: 12px;
          box-shadow:
            inset 0 8px 18px rgba(0,0,0,0.62),
            inset 0 2px 6px rgba(0,0,0,0.8),
            inset 0 -1px 0 rgba(255,255,255,0.06);
          padding: 12px;
        }
        .cell-cavity {
          border-radius: 11px;
          background:
            radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.04) 0%, transparent 55%),
            radial-gradient(ellipse at 50% 80%, rgba(0,0,0,0.32) 0%, transparent 70%),
            linear-gradient(180deg, #1e120a 0%, #2f1d0e 42%, #1a1008 100%);
          box-shadow:
            inset 0 8px 16px rgba(0,0,0,0.82),
            inset 0 3px 8px rgba(0,0,0,0.9),
            inset 0 -1px 1px rgba(255,255,255,0.07),
            inset 0 0 0 1px rgba(0,0,0,0.55);
          position:relative;
          overflow:hidden;
        }
        .cell-cavity::before {
          content:'';
          position:absolute;
          inset:0;
          border-radius:11px;
          background-image:
            radial-gradient(rgba(0,0,0,0.55) 0.7px, transparent 0.8px),
            repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 18px);
          background-size: 7px 7px, auto;
          opacity:0.55;
          pointer-events:none;
        }
        .cell-cavity::after {
          content:'';
          position:absolute;
          inset:2px;
          border-radius:9px;
          background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, transparent 46%);
          pointer-events:none;
        }
        .brass-plate {
          width:26px; height:26px; border-radius:50%;
          background: radial-gradient(circle at 35% 32%, #fff1a0 0%, #ffe88a 12%, #d4af37 38%, #b8962e 62%, #8a6d3b 82%, #5a4318 100%);
          border: 1px solid #3d2a12;
          box-shadow:
            inset 0 1.2px 0 rgba(255,255,255,0.85),
            inset 0 -1.5px 1.5px rgba(0,0,0,0.45),
            0 2px 0 #1a1008,
            0 3px 6px rgba(0,0,0,0.45),
            0 0 0 1px rgba(212,175,55,0.18);
          position:absolute;
          z-index:5;
        }
        .brass-plate::after {
          content:'';
          position:absolute;
          inset:7px;
          border-radius:50%;
          background: radial-gradient(circle at 40% 40%, rgba(255,255,255,0.35), transparent 60%);
        }
        .rivet-side {
          position:absolute;
          width:9px; height:9px; border-radius:50%;
          background: radial-gradient(circle at 35% 30%, #e9d07a 0%, #b8962e 45%, #6e5320 80%, #3d2a12 100%);
          box-shadow: inset 0 0.8px 0 rgba(255,255,255,0.7), 0 1px 2px rgba(0,0,0,0.5);
          border: 0.5px solid rgba(0,0,0,0.35);
        }

        .plaque-aged {
          background:
            linear-gradient(180deg, rgba(255,255,255,0.08) 0%, transparent 12%, rgba(0,0,0,0.22) 100%),
            linear-gradient(180deg, #3a2514 0%, #2f1d0e 55%, #1e120a 100%);
          border: 1.5px solid #8a6d3b;
          border-radius: 12px;
          box-shadow:
            inset 0 1px 0 rgba(255,255,255,0.12),
            inset 0 -2px 0 rgba(0,0,0,0.5),
            inset 0 0 0 1px rgba(212,175,55,0.18),
            0 3px 0 #1e120a,
            0 6px 0 #120c06,
            0 10px 18px rgba(0,0,0,0.38);
          position:relative;
        }
        .plaque-aged::before {
          content:'';
          position:absolute;
          inset:0;
          border-radius:12px;

          pointer-events:none;
        }
        .brass-screw-plaque {

          position:absolute;
        }
        .engraved-num {
          color: #ffe8a8;
          text-shadow:
            0 -1px 0 rgba(0,0,0,0.85),
            0 1px 0 rgba(255,255,255,0.08),

        .wood-btn-dark {
          background:
            repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 18px),

            0 8px 18px rgba(0,0,0,0.42);

        }
        .wood-btn-dark:hover { transform: translateY(-1px); filter: brightness(1.08); }

        }
