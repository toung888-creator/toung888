<style>
:root{--bg:#0a0a0c;--paper:#f5e6c8;--gold:#d4a86a;--red:#c53030}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--paper);font-family:'Noto Serif TC',serif;min-height:100vh}
.ink-bg{position:fixed;inset:0;z-index:-1;opacity:0.4;background:radial-gradient(ellipse at 20% 30%,rgba(212,168,106,0.15),transparent 50%),radial-gradient(ellipse at 80% 70%,rgba(197,48,48,0.08),transparent 50%)}
header{text-align:center;padding:40px 20px 16px;border-bottom:1px solid rgba(212,168,106,0.2)}
header h1{font-size:52px;letter-spacing:0.3em;font-weight:700;color:var(--gold)}
header p{margin-top:10px;opacity:0.6;letter-spacing:0.12em;font-size:13px}
.main{max-width:960px;margin:0 auto;padding:20px}
.input-area{background:rgba(245,230,200,0.05);border:1px solid rgba(212,168,106,0.25);border-radius:16px;padding:26px;text-align:center;margin:18px 0}
.input-area input{width:100%;max-width:420px;background:rgba(0,0,0,0.45);border:1px solid rgba(212,168,106,0.3);color:var(--paper);padding:11px 14px;border-radius:8px;font-family:inherit;font-size:15px;text-align:center}
.btn{background:linear-gradient(180deg,var(--gold),#a07a40);color:#1a1205;border:none;padding:11px 32px;border-radius:999px;font-weight:700;letter-spacing:0.18em;cursor:pointer;font-family:inherit;font-size:15px;margin:10px;transition:0.2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(212,168,106,0.3)}
.coins{display:flex;justify-content:center;gap:16px;margin:20px 0}
.coin{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#f5e6c8,#d4a86a 60%,#8a642f);border:2px solid #5a3f1a;display:flex;align-items:center;justify-content:center;font-weight:700;color:#2b1e08;box-shadow:inset 0 2px 4px rgba(255,255,255,0.5),0 4px 12px rgba(0,0,0,0.5);transition:transform 0.6s cubic-bezier(.34,1.56,.64,1);font-size:12px}
.coin.flip{transform:rotateY(720deg) scale(1.1)}
.yao-list{display:flex;flex-direction:column-reverse;gap:9px;max-width:420px;margin:16px auto}
.yao-item{display:flex;align-items:center;gap:14px;background:rgba(245,230,200,0.04);border:1px solid rgba(212,168,106,0.15);border-radius:10px;padding:11px 16px}
.yao-item.moving{border-color:var(--red);background:rgba(197,48,48,0.08)}
.yao-line{width:86px;height:18px;position:relative}
.yao-line.yang::before{content:'';position:absolute;top:7px;left:0;right:0;height:4px;background:var(--paper);border-radius:2px}
.yao-line.yin::before,.yao-line.yin::after{content:'';position:absolute;top:7px;height:4px;background:var(--paper);border-radius:2px;width:40%}
.yao-line.yin::before{left:0} .yao-line.yin::after{right:0}
.result{background:rgba(245,230,200,0.06);border:1px solid rgba(212,168,106,0.25);border-radius:18px;padding:24px;margin-top:20px}
.result h2{color:var(--gold);font-size:26px;letter-spacing:0.18em;text-align:center}
.tabs{display:flex;gap:7px;justify-content:center;margin:16px 0;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:999px;border:1px solid rgba(212,168,106,0.3);background:transparent;color:var(--paper);cursor:pointer;font-family:inherit;font-size:13px}
.tab.active{background:var(--gold);color:#1a1205;font-weight:700}
.tab-content{background:rgba(0,0,0,0.35);border-radius:10px;padding:18px;line-height:1.95;font-size:14.5px;white-space:pre-wrap}
.yao-detail{padding:9px 0;border-bottom:1px dashed rgba(212,168,106,0.15)}
.yao-detail.moving{background:rgba(197,48,48,0.06);border-left:3px solid var(--red);padding-left:10px;border-radius:6px}
.library{position:fixed;top:0;right:-420px;width:400px;max-width:85vw;height:100vh;background:#12100e;border-left:1px solid rgba(212,168,106,0.3);z-index:100;transition:0.35s;overflow:auto;padding:18px}
.library.open{right:0}
.lib-item{padding:7px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;border:1px solid transparent;font-size:13px}
.lib-item:hover{background:rgba(212,168,106,0.1);border-color:rgba(212,168,106,0.2)}
.small{font-size:11px;opacity:0.45;margin-top:22px;text-align:center;line-height:1.6}
</style>
</head>

<script>
const ICHING = {
1:{name:"乾",py:"qián",bin:"111111",up:"乾",low:"乾",upSym:"☰",lowSym:"☰",gua:"乾：元，亨，利，貞。",tuan:"彖曰：大哉乾元，萬物資始，乃統天。雲行雨施，品物流形。大明始終，六位時成，時乘六龍以御天。乾道變化，各正性命，保合大和，乃利貞。首出庶物，萬國咸寧。",xiang:"象曰：天行健，君子以自強不息。",yao:["初九：潛龍勿用。 象曰：潛龍勿用，陽在下也。【王弼曰：陽爻初潛，時未可動，故勿用以自隱。】","九二：見龍在田，利見大人。 象曰：見龍在田，德施普也。【王弼曰：出潛離隱，德已著見。】","九三：君子終日乾乾，夕惕若厲，无咎。 象曰：終日乾乾，反復道也。【王弼曰：居下之上，處危之際，乾乾夕惕。】","九四：或躍在淵，无咎。 象曰：或躍在淵，進无咎也。【王弼曰：去下體，近上體，進退無常。】","九五：飛龍在天，利見大人。 象曰：飛龍在天，大人造也。【王弼曰：剛健中正，位乎天位。】","上九：亢龍有悔。 象曰：亢龍有悔，盈不可久也。【王弼曰：處極而亢，物極則反。】"],wang:"【王弼總注】乾為天，純陽剛健。元亨利貞為四德，統御四時。君子法乾，自強不息，順時進退。"},
2:{name:"坤",py:"kūn",bin:"000000",up:"坤",low:"坤",upSym:"☷",lowSym:"☷",gua:"坤：元，亨，利牝馬之貞。君子有攸往，先迷後得主，利。西南得朋，東北喪朋。安貞吉。",tuan:"彖曰：至哉坤元，萬物資生，乃順承天。坤厚載物，德合无疆。含弘光大，品物咸亨。",xiang:"象曰：地勢坤，君子以厚德載物。",yao:["初六：履霜，堅冰至。 象曰：履霜堅冰，陰始凝也。【王弼曰：霜者陰始，盛則至冰，防微杜漸。】","六二：直方大，不習无不利。 象曰：六二之動，直以方也。【王弼曰：居中得正，盡地之道。】","六三：含章可貞，或從王事，无成有終。","六四：括囊，无咎无譽。","六五：黃裳元吉。","上六：龍戰于野，其血玄黃。"],wang:"【王弼總注】坤為地，純陰柔順。牝馬為順而健行之象。君子厚德，含弘光大。"},
3:{name:"屯",py:"zhūn",bin:"100010",up:"坎",low:"震",upSym:"☵",lowSym:"☳",gua:"屯：元亨利貞。勿用有攸往，利建侯。",tuan:"彖曰：屯，剛柔始交而難生，動乎險中，大亨貞。雷雨之動滿盈，天造草昧，宜建侯而不寧。",xiang:"象曰：雲雷屯，君子以經綸。",yao:["初九：磐桓，利居貞，利建侯。","六二：屯如邅如，乘馬班如，匪寇婚媾，女子貞不字，十年乃字。","六三：即鹿无虞，惟入于林中，君子幾不如舍，往吝。","六四：乘馬班如，求婚媾往，吉无不利。","九五：屯其膏，小貞吉，大貞凶。","上六：乘馬班如，泣血漣如。"],wang:"【王弼曰】屯者難也，始生之難。坎險震動，宜經綸濟難。"},
4:{name:"蒙",py:"méng",bin:"010001",up:"艮",low:"坎",upSym:"☶",lowSym:"☵",gua:"蒙：亨。匪我求童蒙，童蒙求我。初筮告，再三瀆，瀆則不告。利貞。",tuan:"彖曰：蒙，山下有險，險而止，蒙。蒙亨，以亨行時中也。蒙以養正，聖功也。",xiang:"象曰：山下出泉，蒙，君子以果行育德。",yao:["初六：發蒙，利用刑人，用說桎梏，以往吝。","九二：包蒙吉，納婦吉，子克家。","六三：勿用取女，見金夫，不有躬，无攸利。","六四：困蒙，吝。","六五：童蒙，吉。","上九：擊蒙，不利為寇，利禦寇。"],wang:"【王弼曰】蒙者昧也，童蒙求師，師貴以養正。"},
5:{name:"需",py:"xū",bin:"111010",up:"坎",low:"乾",upSym:"☵",lowSym:"☰",gua:"需：有孚，光亨貞吉，利涉大川。",tuan:"彖曰：需，須也，險在前也，剛健而不陷，其義不困窮矣。",xiang:"象曰：雲上於天，需，君子以飲食宴樂。",yao:["初九：需于郊，利用恆，无咎。","九二：需于沙，小有言，終吉。","九三：需于泥，致寇至。","六四：需于血，出自穴。","九五：需于酒食，貞吉。","上六：入于穴，有不速之客三人來，敬之終吉。"],wang:"【王弼曰】需者待也，乾健遇險，不陷以待，需以孚信而亨。"},
6:{name:"訟",py:"sòng",bin:"010111",up:"乾",low:"坎",upSym:"☰",lowSym:"☵",gua:"訟：有孚窒惕，中吉終凶。利見大人，不利涉大川。",tuan:"彖曰：訟，上剛下險，險而健，訟。訟有孚窒惕，中吉，剛來而得中也。終凶，訟不可成也。",xiang:"象曰：天與水違行，訟，君子以作事謀始。",yao:["初六：不永所事，小有言，終吉。","九二：不克訟，歸而逋，其邑人三百戶，无眚。","六三：食舊德，貞厲，終吉。","九四：不克訟，復即命，渝安貞吉。","九五：訟元吉。","上九：或錫之鞶帶，終朝三褫之。"],wang:"【王弼曰】訟者爭也，險健相違，不可終訟。"},
7:{name:"師",py:"shī",bin:"010000",up:"坤",low:"坎",upSym:"☷",lowSym:"☵",gua:"師：貞丈人吉，无咎。",tuan:"彖曰：師，眾也，貞正也，能以眾正，可以王矣。剛中而應，行險而順。",xiang:"象曰：地中有水，師，君子以容民畜眾。",yao:["初六：師出以律，否臧凶。","九二：在師中吉，无咎，王三錫命。","六三：師或輿尸，凶。","六四：師左次，无咎。","六五：田有禽，利執言，无咎。長子帥師，弟子輿尸，貞凶。","上六：大君有命，開國承家，小人勿用。"],wang:"【王弼曰】師者眾也，興師動眾，正而得中。"},
8:{name:"比",py:"bǐ",bin:"000010",up:"坎",low:"坤",upSym:"☵",lowSym:"☷",gua:"比：吉。原筮元永貞，无咎。不寧方來，後夫凶。",tuan:"彖曰：比，吉也，比，輔也，下順從也。",xiang:"象曰：地上有水，比，先王以建萬國，親諸侯。",yao:["初六：有孚比之，无咎。有孚盈缶，終來有它吉。","六二：比之自內，貞吉。","六三：比之匪人。","六四：外比之，貞吉。","九五：顯比，王用三驅，失前禽，邑人不誡，吉。","上六：比之无首，凶。"],wang:"【王弼曰】比者親也，上下相比，剛中居尊。"},
9:{name:"小畜",py:"xiǎo xù",bin:"111011",up:"巽",low:"乾",upSym:"☴",lowSym:"☰",gua:"小畜：亨，密雲不雨，自我西郊。",tuan:"彖曰：小畜，柔得位而上下應之曰小畜。健而巽，剛中而志行，乃亨。",xiang:"象曰：風行天上，小畜，君子以懿文德。",yao:["初九：復自道，何其咎，吉。","九二：牽復，吉。","九三：輿說輻，夫妻反目。","六四：有孚血去惕出，无咎。","九五：有孚攣如，富以其鄰。","上九：既雨既處，尚德載，婦貞厲，月幾望，君子征凶。"],wang:"【王弼曰】小畜以一陰畜五陽，密雲未雨之象。"},
10:{name:"履",py:"lǚ",bin:"110111",up:"乾",low:"兌",upSym:"☰",lowSym:"☱",gua:"履：履虎尾，不咥人亨。",tuan:"彖曰：履，柔履剛也。說而應乎乾，是以履虎尾，不咥人亨。",xiang:"象曰：上天下澤，履，君子以辨上下，定民志。",yao:["初九：素履往，无咎。","九二：履道坦坦，幽人貞吉。","六三：眇能視，跛能履，履虎尾咥人凶。","九四：履虎尾，愬愬終吉。","九五：夬履，貞厲。","上九：視履考祥，其旋元吉。"],wang:"【王弼曰】履者禮也，以柔履剛，雖履虎尾而亨。"},
11:{name:"泰",py:"tài",bin:"000111",up:"坤",low:"乾",upSym:"☷",lowSym:"☰",gua:"泰：小往大來，吉亨。",tuan:"彖曰：泰，小往大來，吉亨。則是天地交而萬物通也，上下交而其志同也。",xiang:"象曰：天地交泰，后以財成天地之道，輔相天地之宜，以左右民。",yao:["初九：拔茅茹，以其彙征吉。","九二：包荒，用馮河，不遐遺，朋亡，得尚于中行。","九三：无平不陂，无往不復，艱貞无咎。","六四：翩翩不富以其鄰，不戒以孚。","六五：帝乙歸妹，以祉元吉。","上六：城復于隍，勿用師，自邑告命，貞吝。"],wang:"【王弼曰】泰者通也，天地交，陰陽和，君子道長。"},
12:{name:"否",py:"pǐ",bin:"111000",up:"乾",low:"坤",upSym:"☰",lowSym:"☷",gua:"否：否之匪人，不利君子貞，大往小來。",tuan:"彖曰：否之匪人，不利君子貞，大往小來，則是天地不交而萬物不通也。",xiang:"象曰：天地不交否，君子以儉德辟難，不可榮以祿。",yao:["初六：拔茅茹以其彙，貞吉亨。","六二：包承小人吉，大人否亨。","六三：包羞。","九四：有命无咎，疇離祉。","九五：休否，大人吉，其亡其亡，繫于苞桑。","上九：傾否，先否後喜。"],wang:"【王弼曰】否者閉也，天地不交，君子儉德辟難。"},
13:{name:"同人",py:"tóng rén",bin:"101111",up:"乾",low:"離",upSym:"☰",lowSym:"☲",gua:"同人：同人于野亨，利涉大川，利君子貞。",tuan:"彖曰：同人，柔得位得中而應乎乾，曰同人。",xiang:"象曰：天與火同人，君子以類族辨物。",yao:["初九：同人于門，无咎。","六二：同人于宗，吝。","九三：伏戎于莽，升其高陵，三歲不興。","九四：乘其墉，弗克攻，吉。","九五：同人先號咷而後笑，大師克相遇。","上九：同人于郊，无悔。"],wang:"【王弼曰】同人者同也，離明乾健，中正相應。"},
14:{name:"大有",py:"dà yǒu",bin:"111101",up:"離",low:"乾",upSym:"☲",lowSym:"☰",gua:"大有：元亨。",tuan:"彖曰：大有，柔得尊位大中而上下應之曰大有。其德剛健而文明。",xiang:"象曰：火在天上，大有，君子以遏惡揚善，順天休命。",yao:["初九：无交害匪咎，艱則无咎。","九二：大車以載，有攸往无咎。","九三：公用亨于天子，小人弗克。","九四：匪其彭，无咎。","六五：厥孚交如，威如吉。","上九：自天祐之吉无不利。"],wang:"【王弼曰】大有，六五以柔居尊，上下應之，大有其物。"},
15:{name:"謙",py:"qiān",bin:"001000",up:"坤",low:"艮",upSym:"☷",lowSym:"☶",gua:"謙：亨，君子有終。",tuan:"彖曰：謙亨，天道下濟而光明，地道卑而上行。天道虧盈而益謙。",xiang:"象曰：地中有山謙，君子以裒多益寡，稱物平施。",yao:["初六：謙謙君子，用涉大川吉。","六二：鳴謙貞吉。","九三：勞謙君子有終吉。","六四：无不利撝謙。","六五：不富以其鄰，利用侵伐，无不利。","上六：鳴謙，利用行師征邑國。"],wang:"【王弼曰】謙者德之柄也，山在地中，卑而上行。"},
16:{name:"豫",py:"yù",bin:"000100",up:"震",low:"坤",upSym:"☳",lowSym:"☷",gua:"豫：利建侯行師。",tuan:"彖曰：豫，剛應而志行，順以動，豫。天地以順動，故日月不過而四時不忒。",xiang:"象曰：雷出地奮豫，先王以作樂崇德，殷薦之上帝，以配祖考。",yao:["初六：鳴豫凶。","六二：介于石，不終日貞吉。","六三：盱豫悔遲有悔。","九四：由豫大有得勿疑，朋盍簪。","六五：貞疾恆不死。","上六：冥豫成有渝无咎。"],wang:"【王弼曰】豫者悅也，順以動，故天地如之。"},
17:{name:"隨",py:"suí",bin:"100110",up:"兌",low:"震",upSym:"☱",lowSym:"☳",gua:"隨：元亨利貞，无咎。",tuan:"彖曰：隨，剛來而下柔，動而說隨。大亨貞无咎，而天下隨時。",xiang:"象曰：澤中有雷隨，君子以嚮晦入宴息。",yao:["初九：官有渝，貞吉。出門交有功。","六二：係小子，失丈夫。","六三：係丈夫，失小子，隨有求得，利居貞。","九四：隨有獲，貞凶。","九五：孚于嘉吉。","上六：拘係之乃從維之，王用亨于西山。"],wang:"【王弼曰】隨者順也，剛來下柔，動而說，隨時之義。"},
18:{name:"蠱",py:"gǔ",bin:"011001",up:"艮",low:"巽",upSym:"☶",lowSym:"☴",gua:"蠱：元亨，利涉大川。先甲三日，後甲三日。",tuan:"彖曰：蠱，剛上而柔下，巽而止蠱。蠱元亨而天下治也。",xiang:"象曰：山下有風蠱，君子以振民育德。",yao:["初六：幹父之蠱，有子考无咎，厲終吉。","九二：幹母之蠱，不可貞。","九三：幹父之蠱，小有悔无大咎。","六四：裕父之蠱，往見吝。","六五：幹父之蠱，用譽。","上九：不事王侯，高尚其事。"],wang:"【王弼曰】蠱者事也，壞極而有事，振民育德。"},
19:{name:"臨",py:"lín",bin:"000011",up:"坤",low:"兌",upSym:"☷",lowSym:"☱",gua:"臨：元亨利貞，至于八月有凶。",tuan:"彖曰：臨，剛浸而長，說而順，剛中而應，大亨以正，天之道也。",xiang:"象曰：澤上有地臨，君子以教思无窮，容保民无疆。",yao:["初九：咸臨貞吉。","九二：咸臨吉无不利。","六三：甘臨无攸利，既憂之无咎。","六四：至臨无咎。","六五：知臨大君之宜吉。","上六：敦臨吉无咎。"],wang:"【王弼曰】臨者大也，陽浸長以臨陰。"},
20:{name:"觀",py:"guān",bin:"110000",up:"巽",low:"坤",upSym:"☴",lowSym:"☷",gua:"觀：盥而不薦，有孚顒若。",tuan:"彖曰：大觀在上，順而巽，中正以觀天下。觀天之神道而四時不忒，聖人以神道設教而天下服矣。",xiang:"象曰：風行地上觀，先王以省方觀民設教。",yao:["初六：童觀小人无咎，君子吝。","六二：闚觀，利女貞。","六三：觀我生進退。","六四：觀國之光，利用賓于王。","九五：觀我生君子无咎。","上九：觀其生君子无咎。"],wang:"【王弼曰】觀者示也，居尊正以觀下。"},
21:{name:"噬嗑",py:"shì kè",bin:"101001",up:"離",low:"震",upSym:"☲",lowSym:"☳",gua:"噬嗑：亨，利用獄。",tuan:"彖曰：頤中有物曰噬嗑，噬嗑而亨，剛柔分動而明，雷電合而章。",xiang:"象曰：雷電噬嗑，先王以明罰敕法。",yao:["初九：履校滅趾无咎。","六二：噬膚滅鼻无咎。","六三：噬腊肉遇毒，小吝无咎。","九四：噬乾胏得金矢，利艱貞吉。","六五：噬乾肉得黃金，貞厲无咎。","上九：何校滅耳凶。"],wang:"【王弼曰】噬嗑者合也，以剛斷除間。"},
22:{name:"賁",py:"bì",bin:"100101",up:"艮",low:"離",upSym:"☶",lowSym:"☲",gua:"賁：亨，小利有攸往。",tuan:"彖曰：賁亨，柔來而文剛故亨，分剛上而文柔故小利有攸往，天文也。",xiang:"象曰：山下有火賁，君子以明庶政，无敢折獄。",yao:["初九：賁其趾舍車而徒。","六二：賁其須。","九三：賁如濡如永貞吉。","六四：賁如皤如白馬翰如，匪寇婚媾。","六五：賁于丘園束帛戔戔，吝終吉。","上九：白賁无咎。"],wang:"【王弼曰】賁者飾也，柔來文剛，文明以止。"},
23:{name:"剝",py:"bō",bin:"000001",up:"艮",low:"坤",upSym:"☶",lowSym:"☷",gua:"剝：不利有攸往。",tuan:"彖曰：剝，剝也，柔變剛也。不利有攸往，小人長也。",xiang:"象曰：山附于地剝，上以厚下安宅。",yao:["初六：剝床以足蔑貞凶。","六二：剝床以辨蔑貞凶。","六三：剝之无咎。","六四：剝床以膚凶。","六五：貫魚以宮人寵无不利。","上九：碩果不食，君子得輿，小人剝廬。"],wang:"【王弼曰】剝者落也，陰長陽消。"},
24:{name:"復",py:"fù",bin:"100000",up:"坤",low:"震",upSym:"☷",lowSym:"☳",gua:"復：亨。出入无疾，朋來无咎，反復其道，七日來復，利有攸往。",tuan:"彖曰：復亨，剛反動而以順行，是以出入无疾朋來无咎。",xiang:"象曰：雷在地中復，先王以至日閉關，商旅不行，后不省方。",yao:["初九：不遠復，无祗悔元吉。","六二：休復吉。","六三：頻復厲无咎。","六四：中行獨復。","六五：敦復无悔。","上六：迷復凶有災眚。"],wang:"【王弼曰】復者反也，一陽復生，天地之心見焉。"},
25:{name:"無妄",py:"wú wàng",bin:"100111",up:"乾",low:"震",upSym:"☰",lowSym:"☳",gua:"無妄：元亨利貞，其匪正有眚，不利有攸往。",tuan:"彖曰：無妄，剛自外來而為主於內，動而健，剛中而應，大亨以正，天之命也。",xiang:"象曰：天下雷行物與無妄，先王以茂對時育萬物。",yao:["初九：无妄往吉。","六二：不耕獲不菑畬則利有攸往。","六三：无妄之災，或繫之牛，行人之得邑人之災。","九四：可貞无咎。","九五：无妄之疾勿藥有喜。","上九：无妄行有眚无攸利。"],wang:"【王弼曰】無妄者誠也，剛自外來為主，動而健。"},
26:{name:"大畜",py:"dà xù",bin:"111001",up:"艮",low:"乾",upSym:"☶",lowSym:"☰",gua:"大畜：利貞，不家食吉，利涉大川。",tuan:"彖曰：大畜，剛健篤實輝光，日新其德，剛上而尚賢，能止健大正也。",xiang:"象曰：天在山中大畜，君子以多識前言往行，以畜其德。",yao:["初九：有厲利已。","九二：輿說輹。","九三：良馬逐利艱貞，曰閑輿衛利有攸往。","六四：童牛之牿元吉。","六五：豶豕之牙吉。","上九：何天之衢亨。"],wang:"【王弼曰】大畜者大聚也，乾在艮止，止健畜德。"},
27:{name:"頤",py:"yí",bin:"100001",up:"艮",low:"震",upSym:"☶",lowSym:"☳",gua:"頤：貞吉，觀頤自求口實。",tuan:"彖曰：頤貞吉，養正則吉也。觀頤，觀其所養也。",xiang:"象曰：山下有雷頤，君子以慎言語節飲食。",yao:["初九：舍爾靈龜觀我朵頤凶。","六二：顛頤拂經于丘頤征凶。","六三：拂頤貞凶十年勿用。","六四：顛頤吉虎視眈眈其欲逐逐无咎。","六五：拂經居貞吉不可涉大川。","上九：由頤厲吉利涉大川。"],wang:"【王弼曰】頤者養也，慎言語節飲食。"},
28:{name:"大過",py:"dà guò",bin:"011110",up:"兌",low:"巽",upSym:"☱",lowSym:"☴",gua:"大過：棟橈利有攸往亨。",tuan:"彖曰：大過，大者過也。棟橈本末弱也。剛過而中，巽而說行，利有攸往乃亨。",xiang:"象曰：澤滅木大過，君子以獨立不懼，遯世无悶。",yao:["初六：藉用白茅无咎。","九二：枯楊生稊，老夫得其女妻无不利。","九三：棟橈凶。","九四：棟隆吉，有它吝。","九五：枯楊生華，老婦得其士夫无咎无譽。","上六：過涉滅頂凶无咎。"],wang:"【王弼曰】大過者陽過也，本末弱而棟橈。"},
29:{name:"坎",py:"kǎn",bin:"010010",up:"坎",low:"坎",upSym:"☵",lowSym:"☵",gua:"坎：習坎，有孚維心亨，行有尚。",tuan:"彖曰：習坎，重險也。水流而不盈，行險而不失其信。",xiang:"象曰：水洊至習坎，君子以常德行，習教事。",yao:["初六：習坎入于坎窞凶。","九二：坎有險求小得。","六三：來之坎坎險且枕，入于坎窞勿用。","六四：樽酒簋貳用缶，納約自牖終无咎。","九五：坎不盈祗既平无咎。","上六：係用徽纆寘于叢棘三歲不得凶。"],wang:"【王弼曰】坎為水，重險，剛中而有孚。"},
30:{name:"離",py:"lí",bin:"101101",up:"離",low:"離",upSym:"☲",lowSym:"☲",gua:"離：利貞亨，畜牝牛吉。",tuan:"彖曰：離，麗也，日月麗乎天，百穀草木麗乎土，重明以麗乎正，乃化成天下。",xiang:"象曰：明兩作離，大人以繼明照于四方。",yao:["初九：履錯然敬之无咎。","六二：黃離元吉。","九三：日昃之離，不鼓缶而歌則大耋之嗟凶。","九四：突如其來如焚如死如棄如。","六五：出涕沱若戚嗟若吉。","上九：王用出征有嘉折首獲匪其醜无咎。"],wang:"【王弼曰】離為火，麗也，柔麗中正，重明繼明。"},
31:{name:"咸",py:"xián",bin:"001110",up:"兌",low:"艮",upSym:"☱",lowSym:"☶",gua:"咸：亨利貞，取女吉。",tuan:"彖曰：咸，感也。柔上而剛下，二氣感應以相與，止而說，男下女。",xiang:"象曰：山上有澤咸，君子以虛受人。",yao:["初六：咸其拇。","六二：咸其腓凶居吉。","九三：咸其股執其隨往吝。","九四：貞吉悔亡憧憧往來朋從爾思。","九五：咸其脢无悔。","上六：咸其輔頰舌。"],wang:"【王弼曰】咸者感也，山澤通氣，虛以受人。"},
32:{name:"恆",py:"héng",bin:"011100",up:"震",low:"巽",upSym:"☳",lowSym:"☴",gua:"恆：亨无咎利貞，利有攸往。",tuan:"彖曰：恆，久也。剛上而柔下，雷風相與，巽而動，剛柔皆應，恆。",xiang:"象曰：雷風恆，君子以立不易方。",yao:["初六：浚恆貞凶无攸利。","九二：悔亡。","九三：不恆其德或承之羞貞吝。","九四：田无禽。","六五：恆其德貞婦人吉夫子凶。","上六：振恆凶。"],wang:"【王弼曰】恆者久也，雷風相與，久於其道。"},
33:{name:"遯",py:"dùn",bin:"111100",up:"乾",low:"艮",upSym:"☰",lowSym:"☶",gua:"遯：亨，小利貞。",tuan:"彖曰：遯亨，遯而亨也，剛當位而應與時行也。",xiang:"象曰：天下有山遯，君子以遠小人不惡而嚴。",yao:["初六：遯尾厲，勿用有攸往。","六二：執之用黃牛之革莫之勝說。","九三：係遯有疾厲畜臣妾吉。","九四：好遯君子吉，小人否。","九五：嘉遯貞吉。","上九：肥遯无不利。"],wang:"【王弼曰】遯者退也，陰浸長，君子遠小人。"},
34:{name:"大壯",py:"dà zhuàng",bin:"001111",up:"震",low:"乾",upSym:"☳",lowSym:"☰",gua:"大壯：利貞。",tuan:"彖曰：大壯，大者壯也，剛以動故壯。",xiang:"象曰：雷在天上大壯，君子以非禮弗履。",yao:["初九：壯于趾征凶有孚。","九二：貞吉。","九三：小人用壯君子用罔，貞厲，羝羊觸藩羸其角。","九四：貞吉悔亡，藩決不羸壯于大輿之輹。","六五：喪羊于易无悔。","上六：羝羊觸藩不能退不能遂无攸利艱則吉。"],wang:"【王弼曰】大壯者陽壯也，剛以動，非禮弗履。"},
35:{name:"晉",py:"jìn",bin:"000101",up:"離",low:"坤",upSym:"☲",lowSym:"☷",gua:"晉：康侯用錫馬蕃庶，晝日三接。",tuan:"彖曰：晉，進也，明出地上，順而麗乎大明，柔進而上行。",xiang:"象曰：明出地上晉，君子以自昭明德。",yao:["初六：晉如摧如貞吉，罔孚裕无咎。","六二：晉如愁如貞吉，受茲介福于其王母。","六三：眾允悔亡。","九四：晉如鼫鼠貞厲。","六五：悔亡失得勿恤，往吉无不利。","上九：晉其角維用伐邑厲吉无咎貞吝。"],wang:"【王弼曰】晉者進也，明出地上，柔進上行。"},
36:{name:"明夷",py:"míng yí",bin:"101000",up:"坤",low:"離",upSym:"☷",lowSym:"☲",gua:"明夷：利艱貞。",tuan:"彖曰：明入地中明夷，內文明而外柔順以蒙大難，文王以之。",xiang:"象曰：明入地中明夷，君子以蒞眾用晦而明。",yao:["初九：明夷于飛垂其翼。","六二：明夷夷于左股用拯馬壯吉。","九三：明夷于南狩得其大首不可疾貞。","六四：入于左腹獲明夷之心于出門庭。","六五：箕子之明夷利貞。","上六：不明晦初登于天後入于地。"],wang:"【王弼曰】明夷者傷也，明入地中，內明外闇。"},
37:{name:"家人",py:"jiā rén",bin:"101011",up:"巽",low:"離",upSym:"☴",lowSym:"☲",gua:"家人：利女貞。",tuan:"彖曰：家人，女正位乎內男正位乎外，男女正天地之大義也。",xiang:"象曰：風自火出家人，君子以言有物而行有恆。",yao:["初九：閑有家悔亡。","六二：无攸遂在中饋貞吉。","九三：家人嗃嗃悔厲吉，婦子嘻嘻終吝。","六四：富家大吉。","九五：王假有家勿恤吉。","上九：有孚威如終吉。"],wang:"【王弼曰】家人以女正於內男正於外。"},
38:{name:"睽",py:"kuí",bin:"110101",up:"離",low:"兌",upSym:"☲",lowSym:"☱",gua:"睽：小事吉。",tuan:"彖曰：睽，火動而上澤動而下，二女同居其志不同行。",xiang:"象曰：上火下澤睽，君子以同而異。",yao:["初九：悔亡喪馬勿逐自復，見惡人无咎。","九二：遇主于巷无咎。","六三：見輿曳其牛掣其人天且劓无初有終。","九四：睽孤遇元夫交孚厲无咎。","六五：悔亡厥宗噬膚往何咎。","上九：睽孤見豕負塗載鬼一車先張之弧後說之弧匪寇婚媾往遇雨則吉。"],wang:"【王弼曰】睽者乖也，火澤異性。"},
39:{name:"蹇",py:"jiǎn",bin:"001010",up:"坎",low:"艮",upSym:"☵",lowSym:"☶",gua:"蹇：利西南不利東北，利見大人貞吉。",tuan:"彖曰：蹇，難也，險在前也。見險而能止，知矣哉。",xiang:"象曰：山上有水蹇，君子以反身修德。",yao:["初六：往蹇來譽。","六二：王臣蹇蹇匪躬之故。","九三：往蹇來反。","六四：往蹇來連。","九五：大蹇朋來。","上六：往蹇來碩吉利見大人。"],wang:"【王弼曰】蹇者難也，山上有水，見險而止。"},
40:{name:"解",py:"xiè",bin:"010100",up:"震",low:"坎",upSym:"☳",lowSym:"☵",gua:"解：利西南，无所往其來復吉，有攸往夙吉。",tuan:"彖曰：解，險以動動而免乎險解，天地解而雷雨作，雷雨作而百果草木皆甲坼。",xiang:"象曰：雷雨作解，君子以赦過宥罪。",yao:["初六：无咎。","九二：田獲三狐得黃矢貞吉。","六三：負且乘致寇至貞吝。","九四：解而拇朋至斯孚。","六五：君子維有解吉有孚于小人。","上六：公用射隼于高墉之上獲之无不利。"],wang:"【王弼曰】解者緩也，險以動，動而免險。"},
41:{name:"損",py:"sǔn",bin:"100011",up:"艮",low:"兌",upSym:"☶",lowSym:"☱",gua:"損：有孚元吉无咎可貞，利有攸往，曷之用二簋可用享。",tuan:"彖曰：損，損下益上其道上行。損而有孚元吉无咎可貞，利有攸往曷之用二簋可用享，二簋應有時損剛益柔有時。",xiang:"象曰：山下有澤損，君子以懲忿窒欲。",yao:["初九：已事遄往无咎酌損之。","九二：利貞征凶，弗損益之。","六三：三人行則損一人，一人行則得其友。","六四：損其疾使遄有喜无咎。","六五：或益之十朋之龜弗克違元吉。","上九：弗損益之无咎貞吉利有攸往得臣无家。"],wang:"【王弼曰】損下益上，損剛益柔，懲忿窒欲。"},
42:{name:"益",py:"yì",bin:"110001",up:"巽",low:"震",upSym:"☴",lowSym:"☳",gua:"益：利有攸往，利涉大川。",tuan:"彖曰：益，損上益下民說无疆，自上下下其道大光。",xiang:"象曰：風雷益，君子以見善則遷有過則改。",yao:["初九：利用為大作元吉无咎。","六二：或益之十朋之龜弗克違永貞吉。","六三：益之用凶事无咎，有孚中行告公用圭。","六四：中行告公從，利用為依遷國。","九五：有孚惠心勿問元吉，有孚惠我德。","上九：莫益之或擊之，立心勿恆凶。"],wang:"【王弼曰】益者損上益下，民說无疆。"},
43:{name:"夬",py:"guài",bin:"011111",up:"兌",low:"乾",upSym:"☱",lowSym:"☰",gua:"夬：揚于王庭，孚號有厲，告自邑不利即戎，利有攸往。",tuan:"彖曰：夬，決也，剛決柔也。健而說，決而和。",xiang:"象曰：澤上于天夬，君子以施祿及下居德則忌。",yao:["初九：壯于前趾往不勝為咎。","九二：惕號莫夜有戎勿恤。","九三：壯于頄有凶，君子夬夬獨行遇雨若濡有慍无咎。","九四：臀无膚其行次且牽羊悔亡聞言不信。","九五：莧陸夬夬中行无咎。","上六：无號終有凶。"],wang:"【王弼曰】夬者決也，五剛決一柔。"},
44:{name:"姤",py:"gòu",bin:"111110",up:"乾",low:"巽",upSym:"☰",lowSym:"☴",gua:"姤：女壯勿用取女。",tuan:"彖曰：姤，遇也，柔遇剛也。勿用取女不可與長也。天地相遇品物咸章也。",xiang:"象曰：天下有風姤，后以施命誥四方。",yao:["初六：繫于金柅貞吉有攸往見凶羸豕孚蹢躅。","九二：包有魚无咎不利賓。","九三：臀无膚其行次且厲无大咎。","九四：包无魚起凶。","九五：以杞包瓜含章有隕自天。","上九：姤其角吝无咎。"],wang:"【王弼曰】姤者遇也，一陰遇五陽，女壯之象。"},
45:{name:"萃",py:"cuì",bin:"000110",up:"兌",low:"坤",upSym:"☱",lowSym:"☷",gua:"萃：亨，王假有廟，利見大人亨，利貞，用大牲吉利有攸往。",tuan:"彖曰：萃，聚也，順以說剛中而應故聚也，王假有廟致孝享也。",xiang:"象曰：澤上於地萃，君子以除戎器戒不虞。",yao:["初六：有孚不終乃亂乃萃若號一握為笑勿恤往无咎。","六二：引吉无咎孚乃利用禴。","六三：萃如嗟如无攸利往无咎小吝。","九四：大吉无咎。","九五：萃有位无咎匪孚元永貞悔亡。","上六：齎咨涕洟无咎。"],wang:"【王弼曰】萃者聚也，順以說，剛中而應。"},
46:{name:"升",py:"shēng",bin:"011000",up:"坤",low:"巽",upSym:"☷",lowSym:"☴",gua:"升：元亨用見大人，勿恤南征吉。",tuan:"彖曰：柔以時升，巽而順剛中而應是以大亨。",xiang:"象曰：地中生木升，君子以順德積小以高大。",yao:["初六：允升大吉。","九二：孚乃利用禴无咎。","九三：升虛邑。","六四：王用亨于岐山吉无咎。","六五：貞吉升階。","上六：冥升利于不息之貞。"],wang:"【王弼曰】升者進也，地中生木，柔以時升。"},
47:{name:"困",py:"kùn",bin:"010110",up:"兌",low:"坎",upSym:"☱",lowSym:"☵",gua:"困：亨貞大人吉，无咎有言不信。",tuan:"彖曰：困，剛掩也，險以說困而不失其所亨，其唯君子乎。",xiang:"象曰：澤无水困，君子以致命遂志。",yao:["初六：臀困于株木入于幽谷三歲不覿。","九二：困于酒食朱紱方來利用亨祀征凶无咎。","六三：困于石據于蒺藜入于其宮不見其妻凶。","九四：來徐徐困于金車吝有終。","九五：劓刖困于赤紱乃徐有說利用祭祀。","上六：困于葛藟于臲卼曰動悔有悔征吉。"],wang:"【王弼曰】困者窮也，剛為柔掩，險以說，君子致命遂志。"},
48:{name:"井",py:"jǐng",bin:"011010",up:"坎",low:"巽",upSym:"☵",lowSym:"☴",gua:"井：改邑不改井无喪无得，往來井井，汔至亦未繘井羸其瓶凶。",tuan:"彖曰：巽乎水而上水井，井養而不窮也。",xiang:"象曰：木上有水井，君子以勞民勸相。",yao:["初六：井泥不食舊井无禽。","九二：井谷射鮒甕敝漏。","九三：井渫不食為我心惻可用汲王明並受其福。","六四：井甃无咎。","九五：井冽寒泉食。","上六：井收勿幕有孚元吉。"],wang:"【王弼曰】井者不變者也，巽乎水而上水，養而不窮。"},
49:{name:"革",py:"gé",bin:"101110",up:"兌",low:"離",upSym:"☱",lowSym:"☲",gua:"革：己日乃孚，元亨利貞悔亡。",tuan:"彖曰：革，水火相息二女同居其志不相得曰革，己日乃孚革而信之。",xiang:"象曰：澤中有火革，君子以治曆明時。",yao:["初九：鞏用黃牛之革。","六二：己日乃革之征吉无咎。","九三：征凶貞厲革言三就有孚。","九四：悔亡有孚改命吉。","九五：大人虎變未占有孚。","上六：君子豹變小人革面征凶居貞吉。"],wang:"【王弼曰】革者變也，水火相息，文明以說。"},
50:{name:"鼎",py:"dǐng",bin:"011101",up:"離",low:"巽",upSym:"☲",lowSym:"☴",gua:"鼎：元吉亨。",tuan:"彖曰：鼎，象也。以木巽火亨飪也，聖人亨以享上帝而大亨以養聖賢。",xiang:"象曰：木上有火鼎，君子以正位凝命。",yao:["初六：鼎顛趾利出否得妾以其子无咎。","九二：鼎有實我仇有疾不我能即吉。","九三：鼎耳革其行塞雉膏不食方雨虧悔終吉。","九四：鼎折足覆公餗其形渥凶。","六五：鼎黃耳金鉉利貞。","上九：鼎玉鉉大吉无不利。"],wang:"【王弼曰】鼎者法象也，木火亨飪，以享上帝養聖賢。"},
51:{name:"震",py:"zhèn",bin:"100100",up:"震",low:"震",upSym:"☳",lowSym:"☳",gua:"震：亨，震來虩虩笑言啞啞，震驚百里不喪匕鬯。",tuan:"彖曰：震亨，震來虩虩恐致福也，笑言啞啞後有則也。",xiang:"象曰：洊雷震，君子以恐懼修省。",yao:["初九：震來虩虩後笑言啞啞吉。","六二：震來厲億喪貝躋于九陵勿逐七日得。","六三：震蘇蘇震行无眚。","九四：震遂泥。","六五：震往來厲億无喪有事。","上六：震索索視矍矍征凶震不于其躬于其鄰无咎婚媾有言。"],wang:"【王弼曰】震為雷，重震，恐懼修省。"},
52:{name:"艮",py:"gèn",bin:"001001",up:"艮",low:"艮",upSym:"☶",lowSym:"☶",gua:"艮：艮其背不獲其身，行其庭不見其人，无咎。",tuan:"彖曰：艮，止也。時止則止時行則行動靜不失其時其道光明。",xiang:"象曰：兼山艮，君子以思不出其位。",yao:["初六：艮其趾无咎利永貞。","六二：艮其腓不拯其隨其心不快。","九三：艮其限列其夤厲薰心。","六四：艮其身无咎。","六五：艮其輔言有序悔亡。","上九：敦艮吉。"],wang:"【王弼曰】艮者止也，兼山，時止則止時行則行。"},
53:{name:"漸",py:"jiàn",bin:"001011",up:"巽",low:"艮",upSym:"☴",lowSym:"☶",gua:"漸：女歸吉，利貞。",tuan:"彖曰：漸之進也，女歸吉也，進得位往有功也，進以正可以正邦也。",xiang:"象曰：山上有木漸，君子以居賢德善俗。",yao:["初六：鴻漸于干小子厲有言无咎。","六二：鴻漸于磐飲食衎衎吉。","九三：鴻漸于陸夫征不復婦孕不育凶利禦寇。","六四：鴻漸于木或得其桷无咎。","九五：鴻漸于陵婦三歲不孕終莫之勝吉。","上九：鴻漸于逵其羽可用為儀吉。"],wang:"【王弼曰】漸者進也，山上有木，女歸之吉。"},
54:{name:"歸妹",py:"guī mèi",bin:"110100",up:"震",low:"兌",upSym:"☳",lowSym:"☱",gua:"歸妹：征凶无攸利。",tuan:"彖曰：歸妹，天地之大義也，天地不交而萬物不興，歸妹人之終始也。",xiang:"象曰：澤上有雷歸妹，君子以永終知敝。",yao:["初九：歸妹以娣跛能履征吉。","九二：眇能視利幽人貞吉。","六三：歸妹以須反歸以娣。","九四：歸妹愆期遲歸有時。","六五：帝乙歸妹其君之袂不如其娣之袂良，月幾望吉。","上六：女承筐无實士刲羊无血无攸利。"],wang:"【王弼曰】歸妹者嫁也，澤上有雷，說以動。"},
55:{name:"豐",py:"fēng",bin:"101100",up:"震",low:"離",upSym:"☳",lowSym:"☲",gua:"豐：亨，王假之勿憂宜日中。",tuan:"彖曰：豐，大也，明以動故豐，王假之尚大也，勿憂宜日中宜照天下也。",xiang:"象曰：雷電皆至豐，君子以折獄致刑。",yao:["初九：遇其配主雖旬无咎往有尚。","六二：豐其蔀日中見斗往得疑疾有孚發若吉。","九三：豐其沛日中見沬折其右肱无咎。","九四：豐其蔀日中見斗遇其夷主吉。","六五：來章有慶譽吉。","上六：豐其屋蔀其家闚其戶闃其无人三歲不覿凶。"],wang:"【王弼曰】豐者大也，明以動，日中宜照。"},
56:{name:"旅",py:"lǚ",bin:"001101",up:"離",low:"艮",upSym:"☲",lowSym:"☶",gua:"旅：小亨，旅貞吉。",tuan:"彖曰：旅小亨，柔得中乎外而順乎剛止而麗乎明是以小亨旅貞吉也。",xiang:"象曰：山上有火旅，君子以明慎用刑而不留獄。",yao:["初六：旅瑣瑣斯其所取災。","六二：旅即次懷其資得童僕貞。","九三：旅焚其次喪其童僕貞厲。","九四：旅于處得其資斧我心不快。","六五：射雉一矢亡終以譽命。","上九：鳥焚其巢旅人先笑後號咷喪牛于易凶。"],wang:"【王弼曰】旅者客也，山上有火，柔得中乎外。"},
57:{name:"巽",py:"xùn",bin:"011011",up:"巽",low:"巽",upSym:"☴",lowSym:"☴",gua:"巽：小亨，利有攸往，利見大人。",tuan:"彖曰：重巽以申命，剛巽乎中正而志行，柔皆順乎剛是以小亨。",xiang:"象曰：隨風巽，君子以申命行事。",yao:["初六：進退利武人之貞。","九二：巽在床下用史巫紛若吉无咎。","九三：頻巽吝。","六四：悔亡田獲三品。","九五：貞吉悔亡无不利，无初有終，先庚三日後庚三日吉。","上九：巽在床下喪其資斧貞凶。"],wang:"【王弼曰】巽為風，重巽申命，剛巽中正。"},
58:{name:"兌",py:"duì",bin:"110110",up:"兌",low:"兌",upSym:"☱",lowSym:"☱",gua:"兌：亨利貞。",tuan:"彖曰：兌，說也，剛中而柔外說以利貞是以順乎天而應乎人。",xiang:"象曰：麗澤兌，君子以朋友講習。",yao:["初九：和兌吉。","九二：孚兌吉悔亡。","六三：來兌凶。","九四：商兌未寧介疾有喜。","九五：孚于剝有厲。","上六：引兌。"],wang:"【王弼曰】兌為澤，說也，剛中柔外，朋友講習。"},
59:{name:"渙",py:"huàn",bin:"010011",up:"巽",low:"坎",upSym:"☴",lowSym:"☵",gua:"渙：亨，王假有廟，利涉大川利貞。",tuan:"彖曰：渙亨，剛來而不窮柔得位乎外而上同，王假有廟王乃在中也。",xiang:"象曰：風行水上渙，先王以享于帝立廟。",yao:["初六：用拯馬壯吉。","九二：渙奔其机悔亡。","六三：渙其躬无悔。","六四：渙其群元吉，渙有丘匪夷所思。","九五：渙汗其大號，渙王居无咎。","上九：渙其血去逖出无咎。"],wang:"【王弼曰】渙者散也，風行水上，剛來不窮。"},
60:{name:"節",py:"jié",bin:"110010",up:"坎",low:"兌",upSym:"☵",lowSym:"☱",gua:"節：亨，苦節不可貞。",tuan:"彖曰：節亨，剛柔分而剛得中，苦節不可貞其道窮也，天地節而四時成節以制度不傷財不害民。",xiang:"象曰：澤上有水節，君子以制數度議德行。",yao:["初九：不出戶庭无咎。","九二：不出門庭凶。","六三：不節若則嗟若无咎。","六四：安節亨。","九五：甘節吉往有尚。","上六：苦節貞凶悔亡。"],wang:"【王弼曰】節者止也，澤上有水，剛得中，制數度議德行。"},
61:{name:"中孚",py:"zhōng fú",bin:"110011",up:"巽",low:"兌",upSym:"☴",lowSym:"☱",gua:"中孚：豚魚吉利涉大川，利貞。",tuan:"彖曰：中孚，柔在內而剛得中，說而巽孚乃化邦也，豚魚吉信及豚魚也。",xiang:"象曰：澤上有風中孚，君子以議獄緩死。",yao:["初九：虞吉有它不燕。","九二：鳴鶴在陰其子和之，我有好爵吾與爾靡之。","六三：得敵或鼓或罷或泣或歌。","六四：月幾望馬匹亡无咎。","九五：有孚攣如无咎。","上九：翰音登于天貞凶。"],wang:"【王弼曰】中孚者信也，柔在內剛得中，說而巽，信及豚魚。"},
62:{name:"小過",py:"xiǎo guò",bin:"001100",up:"震",low:"艮",upSym:"☳",lowSym:"☶",gua:"小過：亨，利貞可小事不可大事，飛鳥遺之音不宜上宜下大吉。",tuan:"彖曰：小過小者過而亨也，過以利貞與時行也，柔得中是以小事吉也。",xiang:"象曰：山上有雷小過，君子以行過乎恭喪過乎哀用過乎儉。",yao:["初六：飛鳥以凶。","六二：過其祖遇其妣，不及其君遇其臣无咎。","九三：弗過防之從或戕之凶。","九四：无咎弗過遇之往厲必戒勿用永貞。","六五：密雲不雨自我西郊公弋取彼在穴。","上六：弗遇過之飛鳥離之凶是謂災眚。"],wang:"【王弼曰】小過者陽過而小者也，柔得中，行過乎恭。"},
63:{name:"既濟",py:"jì jì",bin:"101010",up:"坎",low:"離",upSym:"☵",lowSym:"☲",gua:"既濟：亨小利貞，初吉終亂。",tuan:"彖曰：既濟亨小者亨也，利貞剛柔正而位當也，初吉柔得中也，終止則亂其道窮也。",xiang:"象曰：水在火上既濟，君子以思患而豫防之。",yao:["初九：曳其輪濡其尾无咎。","六二：婦喪其茀勿逐七日得。","九三：高宗伐鬼方三年克之，小人勿用。","六四：繻有衣袽終日戒。","九五：東鄰殺牛不如西鄰之禴祭實受其福。","上六：濡其首厲。"],wang:"【王弼曰】既濟者定也，水在火上，剛柔正位當，初吉終亂。"},
64:{name:"未濟",py:"wèi jì",bin:"010101",up:"離",low:"坎",upSym:"☲",lowSym:"☵",gua:"未濟：亨，小狐汔濟濡其尾无攸利。",tuan:"彖曰：未濟亨柔得中也，小狐汔濟未出中也，濡其尾无攸利不續終也。",xiang:"象曰：火在水上未濟，君子以慎辨物居方。",yao:["初六：濡其尾吝。","九二：曳其輪貞吉。","六三：未濟征凶利涉大川。","九四：貞吉悔亡震用伐鬼方三年有賞于大國。","六五：貞吉无悔君子之光有孚吉。","上九：有孚于飲酒无咎，濡其首有孚失是。"],wang:"【王弼曰】未濟者未定也，火在水上，剛柔失正而相應，終必濟也。"}

39:{g:"跛行艱難，利西南不利東北利見大人貞吉。",t:"險在前，見險而能止知矣哉。",x:"山上有水蹇，君子反身修德。",y:["往蹇來譽。","王臣蹇蹇匪躬之故。","往蹇來反。","往蹇來連。","大蹇朋來。","往蹇來碩吉利見大人。"]},
40:{g:"解脫，利西南無所往其來復吉有攸往夙吉。",t:"險以動動而免乎險解，天地解而雷雨作。",x:"雷雨作解，君子赦過宥罪。",y:["無咎。","田獲三狐得黃矢貞吉。","負且乘致寇至貞吝。","解而拇朋至斯孚。","君子維有解吉有孚于小人。","公用射隼於高墉之上獲之無不利。"]},
41:{g:"減損有孚元吉無咎可貞利有攸往。",t:"損下益上其道上行，損而有孚。",x:"山下有澤損，君子懲忿窒欲。",y:["已事遄往無咎酌損之。","利貞征凶弗損益之。","三人行則損一人一人行則得其友。","損其疾使遄有喜無咎。","或益之十朋之龜弗克違元吉。","弗損益之無咎貞吉利有攸往得臣無家。"]},
42:{g:"增益利有攸往利涉大川。",t:"損上益下民說無疆自上下下其道大光。",x:"風雷益，君子見善則遷有過則改。",y:["利用為大作元吉無咎。","或益之十朋之龜弗克違永貞吉。","益之用凶事無咎有孚中行告公用圭。","中行告公從利用為依遷國。","有孚惠心勿問元吉有孚惠我德。","莫益之或擊之立心勿恆凶。"]},
43:{g:"決斷揚於王庭孚號有厲告自邑不利即戎。",t:"剛決柔也健而說決而和。",x:"澤上於天夬，君子施祿及下居德則忌。",y:["壯於前趾往不勝為咎。","惕號莫夜有戎勿恤。","壯於頄有凶君子夬夬獨行遇雨若濡有慍無咎。","臀無膚其行次且牽羊悔亡聞言不信。","莧陸夬夬中行無咎。","無號終有凶。"]},
44:{g:"相遇女壯勿用取女。",t:"柔遇剛也勿用取女不可與長也，天地相遇品物咸章。",x:"天下有風姤后以施命誥四方。",y:["繫於金柅貞吉有攸往見凶羸豕孚蹢躅。","包有魚無咎不利賓。","臀無膚其行次且厲無大咎。","包無魚起凶。","以杞包瓜含章有隕自天。","姤其角吝無咎。"]},
45:{g:"聚集亨王假有廟利見大人亨利貞。",t:"順以說剛中而應故聚也，王假有廟致孝享也。",x:"澤上於地萃，君子除戎器戒不虞。",y:["有孚不終乃亂乃萃若號一握為笑勿恤往無咎。","引吉無咎孚乃利用禴。","萃如嗟如無攸利往無咎小吝。","大吉無咎。","萃有位無咎匪孚元永貞悔亡。","齎咨涕洟無咎。"]},
46:{g:"上升元亨用見大人勿恤南征吉。",t:"柔以時升巽而順剛中而應是以大亨。",x:"地中生木升，君子順德積小以高大。",y:["允升大吉。","孚乃利用禴無咎。","升虛邑。","王用亨于岐山吉無咎。","貞吉升階。","冥升利於不息之貞。"]},
47:{g:"困頓亨貞大人吉無咎有言不信。",t:"剛掩也險以說困而不失其所亨其唯君子乎。",x:"澤無水困，君子致命遂志。",y:["臀困於株木入於幽谷三歲不覿。","困於酒食朱紱方來利用亨祀征凶無咎。","困於石據於蒺藜入於其宮不見其妻凶。","來徐徐困於金車吝有終。","劓刖困於赤紱乃徐有說利用祭祀。","困於葛藟於臲卼曰動悔有悔征吉。"]},
48:{g:"井改邑不改井無喪無得往來井井。",t:"巽乎水而上水井，井養而不窮也。",x:"木上有水井，君子勞民勸相。",y:["井泥不食舊井無禽。","井谷射鮒甕敝漏。","井渫不食為我心惻可用汲王明並受其福。","井甃無咎。","井冽寒泉食。","井收勿幕有孚元吉。"]},
49:{g:"變革己日乃孚元亨利貞悔亡。",t:"水火相息二女同居志不相得曰革。",x:"澤中有火革，君子治曆明時。",y:["鞏用黃牛之革。","己日乃革之征吉無咎。","征凶貞厲革言三就有孚。","悔亡有孚改命吉。","大人虎變未占有孚。","君子豹變小人革面征凶居貞吉。"]},
50:{g:"鼎元吉亨。",t:"鼎象也以木巽火亨飪也，聖人亨以享上帝而大亨以養聖賢。",x:"木上有火鼎，君子正位凝命。",y:["鼎顛趾利出否得妾以其子無咎。","鼎有實我仇有疾不我能即吉。","鼎耳革其行塞雉膏不食方雨虧悔終吉。","鼎折足覆公餗其形渥凶。","鼎黃耳金鉉利貞。","鼎玉鉉大吉無不利。"]},
51:{g:"震動亨震來虩虩笑言啞啞震驚百里不喪匕鬯。",t:"震亨震來虩虩恐致福也。",x:"洊雷震，君子恐懼修省。",y:["震來虩虩後笑言啞啞吉。","震來厲億喪貝躋於九陵勿逐七日得。","震蘇蘇震行無眚。","震遂泥。","震往來厲億無喪有事。","震索索視矍矍征凶震不於其躬於其鄰無咎。"]},
52:{g:"止艮其背不獲其身行其庭不見其人無咎。",t:"艮止也時止則止時行則行動靜不失其時。",x:"兼山艮，君子思不出其位。",y:["艮其趾無咎利永貞。","艮其腓不拯其隨其心不快。","艮其限列其夤厲薰心。","艮其身無咎。","艮其輔言有序悔亡。","敦艮吉。"]},
53:{g:"漸進女歸吉利貞。",t:"漸之進也女歸吉也進得位往有功也。",x:"山上有木漸，君子居賢德善俗。",y:["鴻漸於干小子厲有言無咎。","鴻漸於磐飲食衎衎吉。","鴻漸於陸夫征不復婦孕不育凶利禦寇。","鴻漸於木或得其桷無咎。","鴻漸於陵婦三歲不孕終莫之勝吉。","鴻漸於逵其羽可用為儀吉。"]},
54:{g:"歸妹出嫁征凶無攸利。",t:"歸妹天地之大義也。",x:"澤上有雷歸妹，君子永終知敝。",y:["歸妹以娣跛能履征吉。","眇能視利幽人貞吉。","歸妹以須反歸以娣。","歸妹愆期遲歸有時。","帝乙歸妹其君之袂不如其娣之袂良月幾望吉。","女承筐無實士刲羊無血無攸利。"]},
55:{g:"豐大亨王假之勿憂宜日中。",t:"豐大也明以動故豐，王假之尚大也。",x:"雷電皆至豐，君子折獄致刑。",y:["遇其配主雖旬無咎往有尚。","豐其蔀日中見斗往得疑疾有孚發若吉。","豐其沛日中見沬折其右肱無咎。","豐其蔀日中見斗遇其夷主吉。","來章有慶譽吉。","豐其屋蔀其家闚其戶闃其無人三歲不覿凶。"]},
56:{g:"旅居小亨旅貞吉。",t:"柔得中乎外而順乎剛止而麗乎明。",x:"山上有火旅，君子明慎用刑而不留獄。",y:["旅瑣瑣斯其所取災。","旅即次懷其資得童僕貞。","旅焚其次喪其童僕貞厲。","旅於處得其資斧我心不快。","射雉一矢亡終以譽命。","鳥焚其巢旅人先笑後號咷喪牛於易凶。"]},
57:{g:"巽為順小亨利有攸往利見大人。",t:"重巽以申命剛巽乎中正而志行。",x:"隨風巽，君子申命行事。",y:["進退利武人之貞。","巽在床下用史巫紛若吉無咎。","頻巽吝。","悔亡田獲三品。","貞吉悔亡無不利無初有終。","巽在床下喪其資斧貞凶。"]},
58:{g:"兌為悅亨利貞。",t:"兌說也剛中柔外說以利貞。",x:"麗澤兌，君子朋友講習。",y:["和兌吉。","孚兌吉悔亡。","來兌凶。","商兌未寧介疾有喜。","孚於剝有厲。","引兌。"]},
59:{g:"渙散亨王假有廟利涉大川利貞。",t:"剛來而不窮柔得位乎外而上同，王假有廟王乃在中也。",x:"風行水上渙，先王享於帝立廟。",y:["用拯馬壯吉。","渙奔其机悔亡。","渙其躬無悔。","渙其群元吉渙有丘匪夷所思。","渙汗其大號渙王居無咎。","渙其血去逖出無咎。"]},
60:{g:"節制亨苦節不可貞。",t:"剛柔分而剛得中，苦節不可貞其道窮也，天地節而四時成。",x:"澤上有水節，君子制數度議德行。",y:["不出戶庭無咎。","不出門庭凶。","不節若則嗟若無咎。","安節亨。","甘節吉往有尚。","苦節貞凶悔亡。"]},
61:{g:"中孚誠信豚魚吉利涉大川利貞。",t:"柔在內而剛得中說而巽孚乃化邦也，豚魚吉信及豚魚也。",x:"澤上有風中孚，君子議獄緩死。",y:["虞吉有它不燕。","鳴鶴在陰其子和之我有好爵吾與爾靡之。","得敵或鼓或罷或泣或歌。","月幾望馬匹亡無咎。","有孚攣如無咎。","翰音登於天貞凶。"]},
62:{g:"小過越亨利貞可小事不可大事飛鳥遺之音不宜上宜下大吉。",t:"小者過而亨也過以利貞與時行也柔得中。",x:"山上有雷小過，君子行過乎恭喪過乎哀用過乎儉。",y:["飛鳥以凶。","過其祖遇其妣不及其君遇其臣無咎。","弗過防之從或戕之凶。","無咎弗過遇之往厲必戒勿用永貞。","密雲不雨自我西郊公弋取彼在穴。","弗遇過之飛鳥離之凶是謂災眚。"]},
63:{g:"既濟已成亨小利貞初吉終亂。",t:"既濟亨小者亨也利貞剛柔正而位當也初吉柔得中也。",x:"水在火上既濟，君子思患而豫防之。",y:["曳其輪濡其尾無咎。","婦喪其茀勿逐七日得。","高宗伐鬼方三年克之小人勿用。","繻有衣袽終日戒。","東鄰殺牛不如西鄰之禴祭實受其福。","濡其首厲。"]},
64:{g:"未濟未成亨小狐汔濟濡其尾無攸利。",t:"未濟亨柔得中也小狐汔濟未出中也。",x:"火在水上未濟，君子慎辨物居方。",y:["濡其尾吝。","曳其輪貞吉。","未濟征凶利涉大川。","貞吉悔亡震用伐鬼方三年有賞于大國。","貞吉無悔君子之光有孚吉。","有孚於飲酒無咎濡其首有孚失是。"]}
};
let baihuaMode=false;
let lastBen=null,lastZhi=null,lastHasMoving=false,lastQ='';
function toggleBaihua(){
 baihuaMode=!baihuaMode;
 const btn=document.getElementById('baihuaBtn');
 if(btn) btn.textContent=baihuaMode?'白話翻譯：開':'白話翻譯：關';
 if(lastBen) renderResult(lastBen,lastZhi,lastHasMoving,lastQ);
}

let currentYao=[];let throwCount=0;
const trigramNames={'乾':'天','兌':'澤','離':'火','震':'雷','巽':'風','坎':'水','艮':'山','坤':'地'};
function startDiv(){document.getElementById('landing').style.display='none';document.getElementById('divination').style.display='block';renderYaoList();}
function renderYaoList(){const list=document.getElementById('yaoList');list.innerHTML='';for(let i=5;i>=0;i--){const v=currentYao[i];let line='';if(v){const isYang=v.value%2===1;line='<div class="yao-item '+(v.moving?'moving':'')+'"><span style="width:26px;opacity:0.6">'+['初','二','三','四','五','上'][i]+'</span><div class="yao-line '+(isYang?'yang':'yin')+'"></div><span style="font-size:12px">'+(v.value===6?'老陰 6 ✕':v.value===7?'少陽 7':v.value===8?'少陰 8':'老陽 9 ○')+' '+(v.moving?'(動)':'')+'</span></div>';}else{line='<div class="yao-item" style="opacity:0.28"><span style="width:26px">'+['初','二','三','四','五','上'][i]+'</span><div style="width:86px;text-align:center">— 待擲 —</div></div>';}list.innerHTML+=line;}}
function throwCoins(){if(throwCount>=6)return;const btn=document.getElementById('throwBtn');btn.disabled=true;
const coins=[1,2,3].map(()=>Math.random()<0.5?2:3);const sum=coins[0]+coins[1]+coins[2];const moving=sum===6||sum===9;
const els=[document.getElementById('c1'),document.getElementById('c2'),document.getElementById('c3')];
els.forEach((el,i)=>{el.classList.remove('flip');void el.offsetWidth;el.classList.add('flip');el.textContent=coins[i]===2?'陰':'陽';});
setTimeout(()=>{currentYao[throwCount]={value:sum,moving};throwCount++;document.getElementById('throwNum').textContent=throwCount+1>6?6:throwCount+1;renderYaoList();btn.disabled=false;if(throwCount===6){showResult();}},620);
}
function getHexagramByBin(bin){for(let k in ICHING){if(ICHING[k].bin===bin)return ICHING[k];}return null;}
function showResult(){document.getElementById('divination').style.display='none';
const bin=currentYao.map(y=>y.value%2===1?'1':'0').join('');
const binChanged=currentYao.map(y=>{if(y.moving)return y.value%2===0?'1':'0';else return y.value%2===1?'1':'0';}).join('');
const ben=getHexagramByBin(bin);const zhi=getHexagramByBin(binChanged);
const hasMoving=currentYao.some(y=>y.moving);const q=document.getElementById('question').value;
renderResult(ben,zhi,hasMoving,q);
}
function renderResult(ben,zhi,hasMoving,q){lastBen=ben;lastZhi=zhi;lastHasMoving=hasMoving;lastQ=q;
const num = Object.keys(ICHING).find(k=>ICHING[k].name===ben.name);
const baihua = BAIHUA[num];
const zhiNum = zhi ? Object.keys(ICHING).find(k=>ICHING[k].name===zhi.name) : null;
const baihuaZhi = zhiNum ? BAIHUA[zhiNum] : null;

const area=document.getElementById('resultArea');area.style.display='block';
const movingIndices=currentYao.map((y,i)=>y.moving?i:-1).filter(i=>i>=0);
let html='<div class="result"><h2>'+ben.name+' · '+ben.py+' '+(hasMoving && zhi?' → '+zhi.name+' · '+zhi.py:'')+'</h2>'
+(q?'<p style="text-align:center;opacity:0.6;margin-top:6px">所問：'+q+'</p>':'')
+'<div style="display:flex;gap:18px;justify-content:center;margin:18px 0;flex-wrap:wrap">'
+'<div style="text-align:center"><div style="font-size:44px">'+ben.upSym+'<br/>'+ben.lowSym+'</div><div style="margin-top:5px;font-size:12px">'+ben.up+'上 '+ben.low+'下</div><div style="color:#d4a86a;margin-top:4px;font-size:12px">本卦 第'+Object.keys(ICHING).find(k=>ICHING[k].name===ben.name)+'卦</div></div>'
+(hasMoving && zhi?'<div style="text-align:center"><div style="font-size:44px">'+zhi.upSym+'<br/>'+zhi.lowSym+'</div><div style="margin-top:5px;font-size:12px">'+zhi.up+'上 '+zhi.low+'下</div><div style="color:#d4a86a;margin-top:4px;font-size:12px">之卦 第'+Object.keys(ICHING).find(k=>ICHING[k].name===zhi.name)+'卦</div></div>':'')
+'</div>'
+'<div class="tabs"><button class="tab active" onclick="switchTab(event,\'gua\')">卦辭</button><button class="tab" onclick="switchTab(event,\'tuan\')">彖傳</button><button class="tab" onclick="switchTab(event,\'xiang\')">大象</button><button class="tab" onclick="switchTab(event,\'yao\')">爻辭</button><button class="tab" onclick="switchTab(event,\'wang\')">王弼注全</button></div>'
+'<div id="tab-gua" class="tab-content">'+ (baihuaMode ? ('【白話】'+baihua.g+'\n\n') : '') + ben.gua+'\n\n'+ (baihuaMode ? ('【王弼白話】'+baihua.t+'\n\n') : '') + ben.wang +'</div>'
+'<div id="tab-tuan" class="tab-content" style="display:none">'+ (baihuaMode ? ('【白話】'+baihua.t+'\n\n--- 原文 ---\n') : '') + ben.tuan +'</div>'
+'<div id="tab-xiang" class="tab-content" style="display:none">'+ (baihuaMode ? ('【白話】'+baihua.x+'\n\n--- 原文 ---\n') : '') + ben.xiang +'</div>'
+'<div id="tab-yao" class="tab-content" style="display:none">'+ben.yao.map((t,i)=>{const isMove=currentYao[i].moving;const bh = baihua ? baihua.y[i] : '';return '<div class="yao-detail '+(isMove?'moving':'')+'">'+['初','二','三','四','五','上'][i]+'爻 '+t+(baihuaMode && bh ? '<br/><span style="color:#e8d5a8;font-size:13px">【白話】'+bh+'</span>' : '')+(isMove?' 【動爻】':'')+'</div>'}).join('')
+(movingIndices.length>0?'<div style="margin-top:14px;padding:10px;background:rgba(212,168,106,0.1);border-radius:8px">斷占法：'+getRule(movingIndices)+'</div>':'')
+'</div>'
+'<div id="tab-wang" class="tab-content" style="display:none">'+ben.gua+'\n\n'+ben.tuan+'\n\n'+ben.xiang+'\n\n--- 王弼總解 ---\n'+ben.wang+'\n\n--- 六爻王弼 ---\n'+ben.yao.join('\n\n')+'</div>'
+'<div style="text-align:center;margin-top:18px"><button class="btn" onclick="location.reload()">重新占卜</button></div>'
+'</div>';
area.innerHTML=html;
if(hasMoving && zhi){
area.innerHTML+='<div class="result" style="margin-top:16px"><h2>之卦：'+zhi.name+' - '+zhi.gua+'</h2><div class="tab-content" style="margin-top:10px">'+zhi.tuan+'\n\n'+zhi.xiang+'\n\n'+zhi.wang+'</div></div>';
}
window.scrollTo({top:area.offsetTop,behavior:'smooth'});
}
function getRule(moving){if(moving.length===0)return '無動爻，以本卦卦辭為斷，觀時之大勢。';if(moving.length===1)return '一爻動，以本卦動爻爻辭為斷，事在'+['初','二','三','四','五','上'][moving[0]]+'爻。';if(moving.length===2)return '二爻動，以上爻為主，下爻為輔，取上動爻辭為斷。';if(moving.length===3)return '三爻動，以本卦與之卦卦辭參斷，中爻為重。';if(moving.length===4)return '四爻動，以之卦非動爻中最下者為斷。';if(moving.length===5)return '五爻動，以之卦不動之爻為斷。';return '六爻皆動，乾坤兩卦以用九用六為斷，其餘以之卦卦辭為斷。';}
function switchTab(e,id){document.querySelectorAll('.tab-content').forEach(el=>{if(el.id.startsWith('tab-'))el.style.display='none';});document.getElementById('tab-'+id).style.display='block';document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));e.target.classList.add('active');}
function toggleLib(){const lib=document.getElementById('library');lib.classList.toggle('open');if(!lib.dataset.loaded){const list=document.getElementById('libList');let h='';for(let i=1;i<=64;i++){const g=ICHING[i];h+='<div class="lib-item" onclick="viewGua('+i+')"><span>'+i+'. '+g.name+' '+g.upSym+g.lowSym+'</span><span style="opacity:0.5">'+g.up+g.low+'</span></div>';}list.innerHTML=h;lib.dataset.loaded=1;}}
function viewGua(n){const g=ICHING[n];const area=document.getElementById('resultArea');area.style.display='block';area.innerHTML='<div class="result"><h2>第'+n+'卦 '+g.name+' · '+g.py+' '+g.upSym+g.lowSym+'</h2><div class="tab-content" style="margin-top:12px;white-space:pre-wrap">'+g.gua+'\n\n'+g.tuan+'\n\n'+g.xiang+'\n\n--- 王弼總注 ---\n'+g.wang+'\n\n--- 六爻 ---\n'+g.yao.join('\n\n')+'</div><div style="text-align:center;margin-top:14px"><button class="btn" onclick="document.getElementById(\'resultArea\').innerHTML=\'\'">關閉</button></div></div>';document.getElementById('library').classList.remove('open');window.scrollTo({top:area.offsetTop,behavior:'smooth'});}
</script>
