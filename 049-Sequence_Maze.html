  --teal:#00CEC9;
  --yellow:#FDCB6E;

*{

body{
  background:var(--bg);
  color:var(--text);
  overscroll-behavior:none;
}

.glass{
  background:var(--glass);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border);
}

.glass-strong{
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.12);
}

@keyframes shake{
  0%,100%{
    transform:translateX(0)
  }

  20%,60%{
    transform:translateX(-6px)
  }

  40%,80%{
    transform:translateX(6px)
  }
}

.animate-shake{
  animation:shake 0.4s ease;
}

@keyframes pulse-glow{
  0%,100%{
    box-shadow:0 0 0 0 rgba(108,92,231,0.6)
  }

  50%{
    box-shadow:0 0 0 12px rgba(108,92,231,0)
  }
}

.pulse-active{
  animation:pulse-glow 1.6s infinite;
}

@keyframes float{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-4px)
  }
}

@keyframes pop{
  0%{
    transform:scale(0.8)
  }

  60%{
    transform:scale(1.15)
  }

  100%{
    transform:scale(1)
  }
}

.animate-pop{
  animation:pop 0.35s cubic-bezier(0.34,1.56,0.64,1);
}

@keyframes confetti{
  0%{
    transform:translateY(-10vh) rotate(0deg) scale(0);
    opacity:1
  }

  100%{
    transform:translateY(110vh) rotate(720deg) scale(1);
    opacity:0
  }
}

@keyframes slide-in{
  from{
    transform:translateY(12px);
    opacity:0
  }

  to{
    transform:translateY(0);
    opacity:1
  }
}
