        @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&family=Geist+Mono:wght@400;600&display=swap');
        :root { --bg:#f8fafc; --panel:#ffffff; --panel2:#f1f5f9; --border:#e2e8f0; --accent:#ef4444; --blue:#3b82f6; --green:#22c55e; --text:#1e293b; }
        * { font-family: "Geist", system-ui, -apple-system, sans-serif; box-sizing: border-box; }
        .mono { font-family: "Geist Mono", monospace; }
        /* Strict outer grid: (rows+2) x (cols+2) — every count aligns perfectly with board cell */
        .outer-board-grid {
          display: grid;
          gap: 4px;
          box-sizing: border-box;
          padding: 6px;
          background: #f8fafc;
          border-radius: 16px;
          border: 1px solid #e2e8f0;
          justify-content: center;
          align-content: start;
        }
        .corner-cell {
          width: 100%;
          height: 100%;
          box-sizing: border-box;
          border-radius: 10px;
          background: transparent;
          border: 1px dashed transparent;
        }
        .count-cell-aligned {
          width: 100%;
          height: 100%;
          box-sizing: border-box;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          border-radius: 10px;
          font-weight: 700;
          border: 1.5px solid #e2e8f0;
          background: white;
          transition: all .2s;
          position: relative;
          line-height: 1;
        }
        .count-need { font-size: 15px; font-weight: 800; line-height: 1; }
        .count-cur { font-size: 9px; margin-top: 2px; font-weight: 600; opacity: .9; }
        .count-ok { background: #f0fdf4; border-color: #bbf7d0; color: #16a34a; box-shadow: 0 0 0 1px rgba(34,197,94,0.08); }
        .count-under { background: #fefce8; border-color: #fde68a; color: #a16207; }
        .count-over { background: #fef2f2; border-color: #fecaca; color: #ef4444; box-shadow: 0 0 0 1px rgba(239,68,68,0.08); }
        .count-zero-ok { background: #f8fafc; border-color: #e2e8f0; color: #94a3b8; }
        .domino {
          background: #ffffff;
          border: 2px solid #334155;
          border-radius: 10px;
          overflow: hidden;
          transition: all .15s;
          position: relative;
          box-shadow: 0 1px 2px rgba(15,23,42,0.06);
          width: 100%;
          height: 100%;
          box-sizing: border-box;
        }
        .domino:hover { border-color: #1e293b; transform: translateY(-0.5px); box-shadow: 0 6px 20px rgba(15,23,42,0.10); }
        .domino.hint { animation: hintPulse 0.8s ease-in-out infinite alternate; border-color: #eab308; box-shadow: 0 0 0 3px rgba(234,179,8,0.2); }
        @keyframes hintPulse { from { box-shadow: 0 0 0 0 rgba(234,179,8,0.25); } to { box-shadow: 0 0 0 12px rgba(234,179,8,0); } }
        .cell-half { display:flex; align-items:center; justify-content:center; position:relative; cursor:pointer; user-select:none; transition: background .15s; flex: 1 1 0; min-width:0; min-height:0; }
        .cell-half.plus { background: #ef4444; color: white; text-shadow: 0 1px 1px rgba(0,0,0,0.15); }
        .cell-half.minus { background: #3b82f6; color: white; text-shadow: 0 1px 1px rgba(0,0,0,0.15); }
        .cell-half.neutral { background: #ffffff; color: #16a34a; border: 1px dashed #bbf7d0; }
        .cell-half.blank { background: #f1f5f9; }
        .cell-half.blank:hover { background: #e2e8f0; }
        .cell-half.violation { outline: 2.5px solid #ef4444; outline-offset: -2px; z-index:2; }
        .cell-half.violation.plus, .cell-half.violation.minus { filter: brightness(1.05); }
        .pole-label { font-weight: 800; font-size: 20px; line-height:1; }
        @media (max-width: 640px) {
          .pole-label { font-size: 15px; }
          .count-need { font-size: 13px; }
          .count-cur { font-size: 8px; }
          .outer-board-grid { gap: 3px; padding: 4px; }
        }
        .solve-bar { height: 4px; border-radius: 9999px; background: linear-gradient(90deg,#ef4444,#f59e0b,#22c55e,#3b82f6); background-size: 300% 100%; animation: solveBar 1.2s linear infinite; }

<script>
(function(){
  let ctx=null;
  let enabled = localStorage.getItem('magnets_sound_enabled') !== '0';
  function getCtx(){
    if(!ctx){ ctx = new (window.AudioContext||window.webkitAudioContext)(); }
    if(ctx.state==='suspended') ctx.resume();
    return ctx;
  }
  function tone(freq,type,dur,vol,slideTo){
    if(!enabled) return;
    try{
      var c=getCtx();
      var o=c.createOscillator();
      var g=c.createGain();
      o.type=type; o.frequency.value=freq;
      if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, c.currentTime+dur*0.9);
      g.gain.value=vol||0.25;
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+dur);
      o.connect(g); g.connect(c.destination);
      o.start(); o.stop(c.currentTime+dur);
    }catch(e){}
  }
  window.MagnetsSound={
    playPlace:function(){ tone(440,'sine',0.12,0.28,880); setTimeout(function(){tone(880,'sine',0.08,0.18);},60); },
    playNeutral:function(){ tone(300,'triangle',0.18,0.22); },
    playErase:function(){ tone(600,'sine',0.18,0.2,200); },
    playClick:function(){ tone(800,'sine',0.06,0.15); },
    playError:function(){ tone(150,'sawtooth',0.35,0.18); },
    playSuccess:function(){ [261.63,329.63,392,523.25].forEach(function(f,i){setTimeout(function(){tone(f,'sine',0.45,0.25);}, i*120);}); },
    playSolve:function(){ tone(1000,'sine',0.07,0.12); }
  };
  function addBtn(){
    if(document.getElementById('magnets-sound-toggle')) return;
    var btns=document.querySelectorAll('button');
    var parent = btns.length? btns[0].parentElement : null;
    var nb=document.createElement('button');
    nb.id='magnets-sound-toggle';
    nb.title='音效開/關';
    nb.textContent=enabled?'🔊':'🔇';
    nb.style.cssText='width:36px;height:36px;border-radius:8px;border:1px solid #e2e8f0;background:white;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;margin-left:8px;';
    nb.onclick=function(){
      enabled=!enabled;
      localStorage.setItem('magnets_sound_enabled', enabled?'1':'0');
      nb.textContent=enabled?'🔊':'🔇';
      if(enabled){ try{getCtx();}catch(e){} }
    };
    if(parent) parent.appendChild(nb);
    else {
      nb.style.cssText='position:fixed;top:12px;right:12px;z-index:9999;width:40px;height:40px;border-radius:999px;border:1px solid #e2e8f0;background:white;box-shadow:0 2px 8px rgba(0,0,0,0.08);font-size:18px;';
      document.body.appendChild(nb);
    }
  }
  // Hook: observe board mutations to guess action
  let lastBoardText='';
  function scanForChanges(){
    // Find all cells that look like domino halves - they contain + - or are empty but have border
    // We detect clicks by listening to click events and then checking what changed in DOM
    document.addEventListener('click', function(e){
      try{ getCtx(); }catch(err){}
      var t=e.target;
      // small delay to let React update DOM
      setTimeout(function(){
        var txt = (t.innerText||'').trim();
        // Heuristics:
        // If clicked element now shows + or - => place
        if(txt === '+' || txt === '-' || t.textContent.trim()==='+' || t.textContent.trim()==='-'){
          // Check if sibling or parent indicates magnet vs neutral
          var parentTxt = t.parentElement ? t.parentElement.innerText : '';
          if(parentTxt.includes('+') && parentTxt.includes('-')){
            window.MagnetsSound.playPlace();
          } else {
            window.MagnetsSound.playPlace();
          }
        } else if (txt === '' || txt.length===0){
          // Could be erase - check if previous had content
          // We just play erase for empty after click
          var wasMagnet = e.target.dataset ? e.target.dataset.wasMagnet : null;
          // fallback: if we clicked a cell that had +/-, now empty => erase
          // We'll play erase sound for any click that results in empty cell
          // To differentiate, we track last click target's previous text via mousedown
        }
        // Check for win banner
        if(document.body.innerText.includes('恭喜') || document.body.innerText.includes('完成') || document.body.innerText.includes('解題完成') || document.body.innerText.includes('勝利')){
          if(!window._winPlayed){ window._winPlayed=true; setTimeout(function(){window._winPlayed=false;},3000); window.MagnetsSound.playSuccess(); }
        }
      }, 80);
    }, true);

    // mousedown to capture previous value
    document.addEventListener('mousedown', function(e){
      var el=e.target;
      if(el){
        el.dataset = el.dataset || {};
        el.dataset.prevText = (el.innerText||'').trim();
        // also store parent
        if(el.parentElement) el.parentElement.dataset = el.parentElement.dataset || {};
      }
    }, true);

    // More robust: watch for DOM mutations in board area
    var observer = new MutationObserver(function(muts){
      muts.forEach(function(m){
        if(m.type==='childList' || m.type==='characterData'){
          var target = m.target;
          var newText = (target.textContent||'').trim();
          // If a cell changed to neutral (green)
          if(newText === '●' || newText === '•' || target.textContent.includes('中性')){
            // neutral
          }
        }
      });
    });
    observer.observe(document.body, {childList:true, subtree:true, characterData:true});
  }

  // Better: patch click handler to infer action from board diff
  let prevCells = new Map();
  function snapshot(){
    var cells = document.querySelectorAll('[class*="aspect"], [class*="grid"] div');
    // just use all divs with +/-
    var map = new Map();
    document.querySelectorAll('div').forEach(function(d,i){
      var t=(d.innerText||'').trim();
      if(t==='+' || t==='-' || t==='' ){
        // filter by size approx cell
        var r=d.getBoundingClientRect();
        if(r.width>20 && r.width<80 && r.height>20 && r.height<80){
          map.set(d, t);
        }
      }
    });
    return map;
  }

  let lastSnap = new Map();
  document.addEventListener('mousedown', function(){
    lastSnap = snapshot();
  }, true);
  document.addEventListener('click', function(){
    setTimeout(function(){
      var cur = snapshot();
      // compare
      var placed=0, erased=0, neutral=0;
      cur.forEach(function(v,k){
        var prev = lastSnap.get(k);
        if(prev!==undefined && prev!==v){
          if((prev===''||prev==='●') && (v==='+'||v==='-')) placed++;
          else if((prev==='+'||prev==='-') && v==='') erased++;
          else if(v==='●' || v==='•') neutral++;
        }
      });
      // Also detect neutral by background color
      if(placed>0) window.MagnetsSound.playPlace();
      else if(neutral>0) window.MagnetsSound.playNeutral();
      else if(erased>0) window.MagnetsSound.playErase();
      else {
        // fallback click for flip
        var active = document.activeElement;
        window.MagnetsSound.playClick();
      }
      // check error: look for red borders
      var hasError = document.querySelectorAll('[class*="border-red"], [class*="ring-red"], [class*="text-red"]').length>3;
      // only play error if we just placed
      if(hasError && placed>0){
        setTimeout(function(){ window.MagnetsSound.playError(); },150);
      }
    },120);
  }, true);

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', function(){ addBtn(); scanForChanges(); });
  } else { addBtn(); scanForChanges(); }
  setTimeout(function(){ addBtn(); scanForChanges(); },1000);
})();
