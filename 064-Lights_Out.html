}

.text-\[22px\] {

}

}

.font-bold {
  font-weight: 700;
}

  line-height: 0.95;
}

.leading-none {
  line-height: 1;
}

}

  line-height: 1.375;
}

}

.tracking-\[0\.3em\] {
  letter-spacing: 0.3em;
}

  letter-spacing: 0.1em;
}

}

:root{
  --bg:#090b12;
  --surface:#141926;
  --surface-2:#1c2336;
  --surface-3:#242e48;
  --line:#2b3650;
  --ink:#f7f2e2;
  --muted:#9aa3ba;
  --muted-2:#6d7790;
  --yellow:#ffd21f;
  --yellow-2:#ffe66d;
  --amber:#ff9d0a;
  --teal:#4fe3c0;
  --pink:#ff6b9d;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif
}

button{
  font-family:inherit
}

.mono{
  font-family:"IBM Plex Mono", ui-monospace, monospace
}

@keyframes flipPop{
  0%{
    transform:scale(1)
  }

  35%{
    transform:scale(.88) rotate(-1deg)
  }

  70%{
    transform:scale(1.06)
  }

  100%{
    transform:scale(1)
  }
}

@keyframes hintPulse{
  0%,100%{
    box-shadow:0 0 0 3px #fff, 0 0 0 7px rgba(79,227,192,.9), 0 0 28px rgba(79,227,192,.65)
  }

  50%{
    box-shadow:0 0 0 3px #fff, 0 0 0 10px rgba(79,227,192,.35), 0 0 38px rgba(79,227,192,.9)
  }
}

@keyframes fall{
  0%{
    transform:translateY(-10vh) rotate(0deg);
    opacity:1
  }

  100%{
    transform:translateY(105vh) rotate(720deg);
    opacity:.9
  }
}

@keyframes glowPulse{
  0%,100%{
    filter:brightness(1)
  }

  50%{
    filter:brightness(1.18)
  }
}

@keyframes rise{
  from{
    opacity:0;
    transform:translateY(10px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

.rise{
  animation:rise .45s ease both
}

.flip-anim{
  animation:flipPop .32s ease
}

.hint-anim{
  animation:hintPulse 1.1s ease-in-out infinite
}

.glow-anim{
  animation:glowPulse 2.2s ease-in-out infinite
}

.confetti{
  position:absolute;
  top:-20px;
  animation:fall linear infinite;
  pointer-events:none
}

input,button{
  outline:none
}

button:focus-visible{
  outline:3px solid #fff;
  outline-offset:2px
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

.hover\:brightness-110:hover {
  --tw-brightness: brightness(1.1);
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.active\:scale-\[\.98\]:active {
  --tw-scale-x: .98;
  --tw-scale-y: .98;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.disabled\:cursor-not-allowed:disabled {
  cursor: not-allowed;
}

.disabled\:opacity-40:disabled {
  opacity: 0.4;
}

@media (min-width: 640px) {
  .sm\:w-auto {
    width: auto;
  }

  .sm\:min-w-\[210px\] {
    min-width: 210px;
  }

  .sm\:gap-2\.5 {
    gap: 0.625rem;
  }

  .sm\:gap-3 {
    gap: 0.75rem;
  }

  .sm\:rounded-\[20px\] {
    border-radius: 20px;
  }

  .sm\:p-5 {
    padding: 1.25rem;
  }

  .sm\:p-8 {
    padding: 2rem;
  }

  .sm\:px-4 {
    padding-left: 1rem;
    padding-right: 1rem;
  }

  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:pt-7 {
    padding-top: 1.75rem;
  }

  .sm\:text-\[15px\] {
    font-size: 15px;
  }
}

@media (min-width: 1024px) {
  .lg\:w-auto {

  }
