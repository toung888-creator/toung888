<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>攤吃蛇 — 小遊戲</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#10b981;--muted:#94a3b8}
    html,body{height:100%;margin:0;background:linear-gradient(180deg,var(--bg),#071022);font-family:Inter,system-ui,Arial}
    .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:100%;max-width:920px;background:rgba(255,255,255,0.03);border-radius:12px;padding:18px;box-shadow:0 8px 30px rgba(2,6,23,0.6);backdrop-filter:blur(6px);}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    h1{color:#e6eef8;font-size:18px;margin:0}
    .controls{color:var(--muted);font-size:13px}
    .game-area{display:flex;gap:12px;align-items:flex-start}
    #gameCanvas{background:linear-gradient(180deg,#081021,#06111e);border-radius:8px;display:block}
    .sidebar{width:220px;color:#dbeafe}
    .box{background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;margin-bottom:10px}
    .btn{display:inline-block;padding:8px 12px;border-radius:8px;background:var(--accent);color:#042017;text-decoration:none;font-weight:600;cursor:pointer}
    .muted{color:var(--muted);font-size:13px}
    .kbd{display:inline-block;background:rgba(255,255,255,0.03);padding:6px 8px;border-radius:6px;margin-left:6px;font-weight:700}
    .footer{color:var(--muted);font-size:12px;margin-top:8px}
    /* overlay messages */
    .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
    .panel{background:rgba(2,6,23,0.6);backdrop-filter:blur(6px);padding:18px;border-radius:10px;text-align:center;color:#e6eef8}
    .small{font-size:13px;color:var(--muted)}
    @media(max-width:760px){.game-area{flex-direction:column;align-items:center}.sidebar{width:100%}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <header>
        <h1>攤吃蛇 — 小遊戲</h1>
        <div class="controls">方向鍵 / WASD 控制，手機滑動也可控制</div>
      </header>

      <div class="game-area">
        <div style="position:relative;">
          <canvas id="gameCanvas" width="640" height="480"></canvas>
          <div id="overlay" class="overlay" style="pointer-events:none">
            <!-- 由 JS 填充 (開始/暫停/遊戲結束) -->
          </div>
        </div>

        <aside class="sidebar">
          <div class="box">
            <div>分數：<span id="score">0</span></div>
            <div class="small">最高分：<span id="best">0</span></div>
          </div>
          <div class="box small">
            <div>遊戲說明</div>
            <ul>
              <li>吃食物會變長，分數會上升</li>
              <li>撞到自己或牆壁會遊戲結束（可在設定改成穿牆）</li>
              <li>速度會隨分數增加而略微加快</li>
            </ul>
          </div>
          <div class="box">
            <button id="startBtn" class="btn">開始遊戲</button>
            <button id="pauseBtn" class="btn" style="margin-left:8px;background:#64748b">暫停/繼續</button>
          </div>
          <div class="box small">控制：&nbsp;<span class="kbd">← ↑ → ↓</span> 或 <span class="kbd">W A S D</span>
            <div style="margin-top:8px" class="muted">手機：滑動改方向 / 點擊兩下暫停</div>
          </div>
          <div class="footer">存檔：自動儲存於本機 localStorage</div>
        </aside>
      </div>
    </div>
  </div>

<script>
// 攤吃蛇 — 單檔 HTML 小遊戲
// 功能：鍵盤 + 手機滑動控制、分數、最高分、速度遞增、暫停、重新開始、穿牆模式可選

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const startBtn = document.getElementById('startBtn');
const pauseBtn = document.getElementById('pauseBtn');

// 設定
const CELL = 20; // 網格大小（像素）
let COLS = Math.floor(canvas.width / CELL);
let ROWS = Math.floor(canvas.height / CELL);
let wrapWalls = false; // 是否穿牆（可自行改）

// 遊戲狀態
let snake = [];
let dir = {x:1,y:0};
let nextDir = {x:1,y:0};
let food = null;
let score = 0;
let best = parseInt(localStorage.getItem('tansnake_best')||'0',10);
bestEl.textContent = best;
let speed = 6; // 格/秒
let lastTick = 0;
let running = false;
let paused = false;
let gameOver = false;

function resetGame(){
  COLS = Math.floor(canvas.width / CELL);
  ROWS = Math.floor(canvas.height / CELL);
  snake = [];
  const startLen = 4;
  const sx = Math.floor(COLS/3);
  const sy = Math.floor(ROWS/2);
  for(let i=0;i<startLen;i++) snake.push({x:sx-i,y:sy});
  dir = {x:1,y:0};
  nextDir = {x:1,y:0};
  placeFood();
  score = 0;
  speed = 6;
  gameOver = false;
  updateHUD();
}

function placeFood(){
  let tries = 0;
  while(true){
    const fx = Math.floor(Math.random()*COLS);
    const fy = Math.floor(Math.random()*ROWS);
    if(!snake.some(s=>s.x===fx && s.y===fy)){
      food = {x:fx,y:fy};
      return;
    }
    if(++tries>500) return; // safety
  }
}

function updateHUD(){
  scoreEl.textContent = score;
  bestEl.textContent = best;
}

function draw(){
  // 背景
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // grid subtle
  ctx.fillStyle = '#061320';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // 食物
  if(food){
    drawCell(food.x,food.y,'#ef4444');
    // small shine
    ctx.fillStyle='rgba(255,255,255,0.08)';
    ctx.fillRect(food.x*CELL+CELL*0.22, food.y*CELL+CELL*0.14, CELL*0.35, CELL*0.35);
  }

  // snake
  for(let i=snake.length-1;i>=0;i--){
    const s = snake[i];
    const t = i===0 ? 0.75 : (1 - i/snake.length*0.5);
    const hue = 160 + Math.floor(i*0.6);
    const color = `rgba(16,185,129,${t})`;
    drawCell(s.x,s.y,color,true);
  }
}

function drawCell(cx,cy,fill,rounded=false){
  const x = cx*CELL; const y = cy*CELL;
  ctx.fillStyle = fill;
  if(rounded){
    const r = Math.min(6,CELL*0.25);
    roundRect(ctx,x+1,y+1,CELL-2,CELL-2,r,true,false);
  }else{
    ctx.fillRect(x+1,y+1,CELL-2,CELL-2);
  }
}

function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
  if (typeof stroke === 'undefined') stroke = true;
  if (typeof radius === 'undefined') radius = 5;
  if (typeof radius === 'number') {
    radius = {tl: radius, tr: radius, br: radius, bl: radius};
  } else {
    var defaultRadius = {tl: 0, tr: 0, br: 0, bl: 0};
    for (var side in defaultRadius) radius[side] = radius[side] || defaultRadius[side];
  }
  ctx.beginPath();
  ctx.moveTo(x + radius.tl, y);
  ctx.lineTo(x + width - radius.tr, y);
  ctx.quadraticCurveTo(x + width, y, x + width, y + radius.tr);
  ctx.lineTo(x + width, y + height - radius.br);
  ctx.quadraticCurveTo(x + width, y + height, x + width - radius.br, y + height);
  ctx.lineTo(x + radius.bl, y + height);
  ctx.quadraticCurveTo(x, y + height, x, y + height - radius.bl);
  ctx.lineTo(x, y + radius.tl);
  ctx.quadraticCurveTo(x, y, x + radius.tl, y);
  ctx.closePath();
  if (fill) ctx.fill();
  if (stroke) ctx.stroke();
}

function step(){
  // apply queued dir change if valid
  if((nextDir.x!==-dir.x || nextDir.y!==-dir.y)){ dir = nextDir; }

  const head = {x:snake[0].x + dir.x, y:snake[0].y + dir.y};

  // 碰牆處理
  if(wrapWalls){
    if(head.x<0) head.x = COLS-1;
    if(head.x>=COLS) head.x = 0;
    if(head.y<0) head.y = ROWS-1;
    if(head.y>=ROWS) head.y = 0;
  } else {
    if(head.x<0 || head.x>=COLS || head.y<0 || head.y>=ROWS){
      return lose();
    }
  }

  // 碰到自己
  if(snake.some(s=>s.x===head.x && s.y===head.y)){
    return lose();
  }

  // 推進
  snake.unshift(head);

  // 吃到食物
  if(food && head.x===food.x && head.y===food.y){
    score += 10;
    // 每吃到一定數量提高速度
    speed = 6 + Math.floor(score/50);
    placeFood();
    if(score>best){ best = score; localStorage.setItem('tansnake_best',best); }
    updateHUD();
  } else {
    // 正常移動：去尾
    snake.pop();
  }
}

function lose(){
  running = false;
  gameOver = true;
  showOverlay('gameover');
}

function showOverlay(mode){
  overlay.innerHTML = '';
  overlay.style.pointerEvents = 'auto';
  const panel = document.createElement('div');
  panel.className = 'panel';
  if(mode==='start'){
    panel.innerHTML = `<h2>攤吃蛇</h2><p class="small">按 開始 或 鍵盤空白鍵 開始遊戲<br>手機滑動或鍵盤方向控制</p><div style="margin-top:8px"><button id='overlayStart' class='btn'>開始遊戲</button></div>`;
  } else if(mode==='paused'){
    panel.innerHTML = `<h2>遊戲暫停</h2><p class="small">再次點按暫停或按 P 恢復</p>`;
  } else if(mode==='gameover'){
    panel.innerHTML = `<h2>遊戲結束</h2><p class="small">你的分數：<strong>${score}</strong></p><div style="margin-top:8px"><button id='replayBtn' class='btn'>再玩一次</button></div>`;
  }
  overlay.appendChild(panel);

  // buttons
  const ob = document.getElementById('overlayStart');
  if(ob) ob.addEventListener('click',()=>{ overlay.style.pointerEvents='none'; startGame(); });
  const rb = document.getElementById('replayBtn');
  if(rb) rb.addEventListener('click',()=>{ overlay.style.pointerEvents='none'; resetGame(); startGame(); });
}

// 主回圈
function loop(ts){
  if(!lastTick) lastTick = ts;
  const dt = (ts - lastTick)/1000;
  const interval = 1 / Math.max(1, speed);
  if(running && !paused){
    if(dt >= interval){
      // 可做多步補償
      const steps = Math.floor(dt / interval);
      for(let i=0;i<steps;i++) step();
      lastTick = ts;
    }
  } else {
    lastTick = ts;
  }
  draw();
  requestAnimationFrame(loop);
}

// control handlers
window.addEventListener('keydown', e=>{
  if(e.key==='ArrowUp' || e.key==='w' || e.key==='W') nextDir = {x:0,y:-1};
  if(e.key==='ArrowDown' || e.key==='s' || e.key==='S') nextDir = {x:0,y:1};
  if(e.key==='ArrowLeft' || e.key==='a' || e.key==='A') nextDir = {x:-1,y:0};
  if(e.key==='ArrowRight' || e.key==='d' || e.key==='D') nextDir = {x:1,y:0};
  if(e.key===' '){ if(!running) startGame(); }
  if(e.key==='p' || e.key==='P'){ togglePause(); }
});

startBtn.addEventListener('click',()=>{ if(!running) startGame(); else { resetGame(); } });
pauseBtn.addEventListener('click',togglePause);

function startGame(){
  if(gameOver) resetGame();
  running = true; paused = false; overlay.style.pointerEvents='none'; overlay.innerHTML=''; lastTick = 0;
}

function togglePause(){
  if(!running) return;
  paused = !paused;
  if(paused) showOverlay('paused'); else { overlay.innerHTML=''; overlay.style.pointerEvents='none'; }
}

// touch controls（簡單滑動判斷）
let touchStart = null; let lastTap = 0;
canvas.addEventListener('touchstart', e=>{
  const t = e.touches[0]; touchStart = {x:t.clientX,y:t.clientY,time:Date.now()};
  // detect double tap for pause
  const now = Date.now();
  if(now - lastTap < 350){ togglePause(); }
  lastTap = now;
});
canvas.addEventListener('touchend', e=>{
  if(!touchStart) return; const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x; const dy = t.clientY - touchStart.y;
  if(Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
  if(Math.abs(dx) > Math.abs(dy)){
    nextDir = dx>0 ? {x:1,y:0} : {x:-1,y:0};
  } else {
    nextDir = dy>0 ? {x:0,y:1} : {x:0,y:-1};
  }
  touchStart = null;
});

// resize canvas to be responsive while keeping grid
function fitCanvas(){
  const containerW = Math.min(window.innerWidth - 64, 760);
  // keep aspect ratio same as initial
  const ratio = canvas.width / canvas.height;
  let w = Math.min(760, containerW);
  let h = Math.floor(w / ratio);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

// initial
resetGame();
showOverlay('start');
requestAnimationFrame(loop);

</script>
</body>
</html>
