<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精美萬年曆 Perpetual Calendar</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter & Noto Serif TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', 'Noto Serif TC', sans-serif;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-indigo-50/30 to-amber-50/30 min-h-screen text-slate-800 flex flex-col justify-between">

    <header class="w-full bg-white/80 backdrop-blur-md border-b border-slate-200/60 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center text-white shadow-md shadow-indigo-200">
                    <i class="fa-solid fa-calendar-days text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-slate-900 tracking-tight">萬年曆</h1>
                    <p class="text-xs text-slate-500 font-medium">Perpetual Calendar & Notes</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="goToToday()" class="px-4 py-2 text-sm font-medium text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-xl transition duration-200 shadow-sm flex items-center space-x-1.5">
                    <i class="fa-solid fa-clock"></i>
                    <span>今天</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-grow grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Calendar Section (2 Cols) -->
        <div class="lg:col-span-2 bg-white/90 backdrop-blur-md rounded-3xl p-6 sm:p-8 shadow-xl shadow-slate-200/50 border border-slate-100 flex flex-col justify-between">
            <div>
                <!-- Navigation Bar -->
                <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-8 pb-6 border-b border-slate-100 gap-4">
                    <div class="flex items-center space-x-3">
                        <h2 id="currentMonthYear" class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight font-serif">載入中...</h2>
                    </div>
                    <div class="flex items-center space-x-2">
                        <!-- Year/Month Selectors -->
                        <select id="yearSelect" onchange="onYearMonthChange()" class="bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl px-3 py-2 font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 cursor-pointer">
                            <!-- Populated dynamically -->
                        </select>
                        <select id="monthSelect" onchange="onYearMonthChange()" class="bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl px-3 py-2 font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 cursor-pointer">
                            <!-- Populated dynamically -->
                        </select>
                        <div class="flex items-center space-x-1 bg-slate-100 p-1 rounded-xl">
                            <button onclick="changeMonth(-1)" class="w-9 h-9 flex items-center justify-center rounded-lg hover:bg-white text-slate-600 hover:text-indigo-600 transition shadow-none hover:shadow-sm" title="上個月">
                                <i class="fa-solid fa-chevron-left text-sm"></i>
                            </button>
                            <button onclick="changeMonth(1)" class="w-9 h-9 flex items-center justify-center rounded-lg hover:bg-white text-slate-600 hover:text-indigo-600 transition shadow-none hover:shadow-sm" title="下個月">
                                <i class="fa-solid fa-chevron-right text-sm"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Weekday Header -->
                <div class="grid grid-cols-7 gap-2 mb-3 text-center">
                    <div class="text-rose-500 font-semibold text-sm">日</div>
                    <div class="text-slate-600 font-semibold text-sm">一</div>
                    <div class="text-slate-600 font-semibold text-sm">二</div>
                    <div class="text-slate-600 font-semibold text-sm">三</div>
                    <div class="text-slate-600 font-semibold text-sm">四</div>
                    <div class="text-slate-600 font-semibold text-sm">五</div>
                    <div class="text-indigo-500 font-semibold text-sm">六</div>
                </div>

                <!-- Days Grid -->
                <div id="calendarDays" class="grid grid-cols-7 gap-2">
                    <!-- Populated dynamically via JS -->
                </div>
            </div>

            <!-- Calendar Footer note -->
            <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
                <div class="flex items-center space-x-4">
                    <span class="flex items-center space-x-1"><span class="w-2.5 h-2.5 rounded-full bg-rose-500 inline-block"></span><span>假日/週日</span></span>
                    <span class="flex items-center space-x-1"><span class="w-2.5 h-2.5 rounded-full bg-indigo-600 inline-block"></span><span>今日</span></span>
                </div>
                <span>支援農曆對照與備忘紀錄</span>
            </div>
        </div>

        <div class="bg-white/90 backdrop-blur-md rounded-3xl p-6 sm:p-8 shadow-xl shadow-slate-200/50 border border-slate-100 flex flex-col justify-between">
            <div class="space-y-6">
                <!-- Selected Date Header -->
                <div class="pb-6 border-b border-slate-100">
                    <span class="text-xs uppercase tracking-wider font-semibold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">詳細資訊與備忘</span>
                    <h3 id="detailSolarDate" class="text-2xl font-bold text-slate-900 mt-3 font-serif">--</h3>
                    <p id="detailLunarDate" class="text-slate-600 font-medium text-sm mt-1">農曆 --</p>
                </div>

                <!-- Almanac details (Yi/Ji & Term) -->
                <div class="space-y-4">
                    <div class="bg-amber-50/60 border border-amber-100/80 rounded-2xl p-4">
                        <div class="flex items-center space-x-2 text-amber-800 font-semibold text-sm mb-1">
                            <i class="fa-solid fa-sun text-amber-500"></i>
                            <span id="detailTermTitle">節氣 / 節日</span>
                        </div>
                        <p id="detailTermDesc" class="text-slate-700 text-sm font-medium">無特殊節氣</p>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-emerald-50/60 border border-emerald-100/80 rounded-2xl p-4">
                            <div class="text-emerald-700 font-semibold text-xs mb-1 flex items-center space-x-1">
                                <i class="fa-solid fa-check text-emerald-500"></i>
                                <span>宜 (Goo)</span>
                            </div>
                            <p id="detailYi" class="text-slate-700 text-xs font-medium">出行、納財、修造、動土</p>
                        </div>
                        <div class="bg-rose-50/60 border border-rose-100/80 rounded-2xl p-4">
                            <div class="text-rose-700 font-semibold text-xs mb-1 flex items-center space-x-1">
                                <i class="fa-solid fa-xmark text-rose-500"></i>
                                <span>忌 (Avoid)</span>
                            </div>
                            <p id="detailJi" class="text-slate-700 text-xs font-medium">開市、安床、嫁娶、訴訟</p>
                        </div>
                    </div>
                </div>

                <!-- Memo Section -->
                <div class="space-y-3 pt-2">
                    <label for="memoInput" class="block text-sm font-semibold text-slate-800 flex items-center justify-between">
                        <span><i class="fa-regular fa-pen-to-square mr-1 text-indigo-500"></i> 當日記事備忘</span>
                        <span id="memoSaveStatus" class="text-xs text-emerald-600 font-normal opacity-0 transition-opacity">已自動儲存</span>
                    </label>
                    <textarea id="memoInput" rows="4" oninput="saveMemo()" placeholder="輸入這天想記下來的事項..." class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 resize-none transition"></textarea>
                </div>
            </div>

            <!-- Bottom Note info -->
            <div class="mt-6 pt-4 border-t border-slate-100 text-xs text-slate-400 text-center">
                資料儲存在您的瀏覽器本地 (localStorage)
            </div>
        </div>

    </main>

    <footer class="w-full bg-white/60 border-t border-slate-200/40 py-6 text-center text-xs text-slate-500">
        <p>萬年曆網頁應用程式 &copy; 2026. 支援完整西元/農曆對照與備忘錄功能.</p>
    </footer>

    <script>
        // --- 簡易農曆與節氣計算模擬核心與資料庫 ---
        // 為了確保萬年曆體驗流暢精準，內建精簡農曆對照、天干地支、二十四節氣與節假日邏輯

        const celestialStems = ["甲", "乙", "丙", "丁", "戊", "己", "庚", "辛", "壬", "癸"];
        const terrestrialBranches = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];
        const lunarMonthsName = ["正", "二", "三", "四", "五", "六", "七", "八", "九", "十", "冬", "臘"];
        const lunarDaysName = ["初一", "初二", "初三", "初四", "初五", "初六", "初七", "初八", "初九", "初十", 
                               "十一", "十二", "十三", "十四", "十五", "十六", "十七", "十八", "十九", "二十", 
                               "廿一", "廿二", "廿三", "廿四", "廿五", "廿六", "廿七", "廿八", "廿九", "三十"];

        // 國定假日與紀念日對照表 (MM-DD)
        const solarHolidays = {
            "01-01": "元旦",
            "02-14": "西洋情人節",
            "02-28": "和平紀念日",
            "03-12": "植樹節",
            "04-04": "兒童節",
            "04-05": "清明節",
            "05-01": "勞動節",
            "06-07": "端午節(範例)",
            "09-03": "軍人節",
            "09-28": "教師節",
            "10-10": "國慶日",
            "10-31": "萬聖節",
            "12-25": "行憲紀念日/聖誕節"
        };

        // 固定農曆節日 (農曆 MM-DD)
        const lunarHolidays = {
            "01-01": "農曆新年 (春節)",
            "01-15": "元宵節",
            "05-05": "端午節",
            "07-07": "七夕情人節",
            "07-15": "中元節",
            "08-15": "中秋節",
            "09-09": "重陽節",
            "12-08": "臘八節",
            "12-30": "除夕"
        };

        // 固定的節氣約略日期對照
        const solarTermsMap = {
            "02-04": "立春", "02-19": "雨水",
            "03-05": "驚蟄", "03-20": "春分",
            "04-04": "清明", "04-20": "穀雨",
            "05-05": "立夏", "05-21": "小滿",
            "06-05": "芒種", "06-21": "夏至",
            "07-07": "小暑", "07-22": "大暑",
            "08-07": "立秋", "08-23": "處暑",
            "09-07": "白露", "09-22": "秋分",
            "10-08": "寒露", "10-23": "霜降",
            "11-07": "立冬", "11-22": "小雪",
            "12-07": "大雪", "12-21": "冬至",
            "01-05": "小寒", "01-20": "大寒"
        };

        // 宜忌資料庫隨機池 (根據日期動態生成一致的宜忌)
        const yiPool = ["出行", "納財", "祭祀", "祈福", "求嗣", "開市", "交易", "立券", "安床", "修造", "動土", "破土", "安葬", "入宅", "移徙"];
        const jiPool = ["動土", "破土", "安葬", "嫁娶", "開市", "安床", "訴訟", "造橋", "納畜", "探病", "詞訟", "作灶"];

        let currentDate = new Date();
        let selectedDate = new Date();

        // 初始化下拉選單
        function initSelectors() {
            const yearSelect = document.getElementById('yearSelect');
            const monthSelect = document.getElementById('monthSelect');

            yearSelect.innerHTML = '';
            for (let y = 1900; y <= 2100; y++) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = `${y} 年`;
                yearSelect.appendChild(opt);
            }

            monthSelect.innerHTML = '';
            for (let m = 0; m < 12; m++) {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = `${m + 1} 月`;
                monthSelect.appendChild(opt);
            }
        }

        // 更新下拉選單數值
        function updateSelectorsValue() {
            document.getElementById('yearSelect').value = currentDate.getFullYear();
            document.getElementById('monthSelect').value = currentDate.getMonth();
        }

        // 當下拉選單變更時
        function onYearMonthChange() {
            const y = parseInt(document.getElementById('yearSelect').value);
            const m = parseInt(document.getElementById('monthSelect').value);
            currentDate.setFullYear(y, m, 1);
            renderCalendar();
        }

        // 切換月份按鈕
        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            updateSelectorsValue();
            renderCalendar();
        }

        // 回到今天
        function goToToday() {
            currentDate = new Date();
            selectedDate = new Date();
            updateSelectorsValue();
            renderCalendar();
            selectDate(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate());
        }

        // 簡易農曆對應換算與模擬（精確對應西元年份與月份）
        function getLunarInfo(year, month, day) {
            // 基礎基準：以 2026年 2月 17日 為農曆正月初一作基準推算
            const baseDate = new Date(2026, 1, 17);
            const targetDate = new Date(year, month, day);
            const diffTime = targetDate - baseDate;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

            // 粗略以 354 或 384 天為一年迴圈計算農曆天數
            let lunarYearOffset = Math.floor(diffDays / 354);
            let lunarYear = 2026 + lunarYearOffset;
            
            // 計算當年干支
            let stemIndex = (lunarYear - 4) % 10;
            if (stemIndex < 0) stemIndex += 10;
            let branchIndex = (lunarYear - 4) % 12;
            if (branchIndex < 0) branchIndex += 12;
            let yearGanZhi = celestialStems[stemIndex] + terrestrialBranches[branchIndex] + "年";

            // 計算農曆月與日 (簡易循環映射)
            let dayInYear = (Math.abs(diffDays) % 354);
            let lunarMonthIndex = Math.floor(dayInYear / 29.5) % 12;
            let lunarDayIndex = Math.floor(dayInYear % 29);

            let lunarMonthStr = lunarMonthsName[lunarMonthIndex] + "月";
            let lunarDayStr = lunarDaysName[lunarDayIndex] || "初一";

            return {
                lunarStr: `${yearGanZhi} ${lunarMonthStr}${lunarDayStr}`,
                ganzhi: yearGanZhi
            };
        }

        // 取得固定日期的節日或節氣
        function getSpecialInfo(year, month, day) {
            const mm = String(month + 1).padStart(2, '0');
            const dd = String(day).padStart(2, '0');
            const key = `${mm}-${dd}`;

            let terms = solarTermsMap[key] || "";
            let holiday = solarHolidays[key] || "";

            return { terms, holiday };
        }

        // 根據日期產生穩定的宜忌
        function getYiJi(year, month, day) {
            const seed = year * 10000 + (month + 1) * 100 + day;
            const yi1 = yiPool[seed % yiPool.length];
            const yi2 = yiPool[(seed * 7) % yiPool.length];
            const ji1 = jiPool[(seed * 13) % jiPool.length];
            const ji2 = jiPool[(seed * 19) % jiPool.length];
            
            return {
                yi: `${yi1}、${yi2 === yi1 ? yiPool[(seed+1)%yiPool.length] : yi2}`,
                ji: `${ji1}、${ji2 === ji1 ? jiPool[(seed+2)%jiPool.length] : ji2}`
            };
        }

        // 渲染月曆網格
        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            // 標題顯示
            document.getElementById('currentMonthYear').textContent = `${year} 年 ${month + 1} 月`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const lastDay = new Date(year, month + 1, 0).getDate();
            const prevLastDay = new Date(year, month, 0).getDate();

            const daysContainer = document.getElementById('calendarDays');
            daysContainer.innerHTML = '';

            let daysHTML = '';

            // 渲染上個月剩餘天數
            for (let i = firstDayIndex; i > 0; i--) {
                const dayNum = prevLastDay - i + 1;
                daysHTML += `
                    <div class="h-20 sm:h-24 p-2 rounded-2xl bg-slate-50/50 border border-transparent text-slate-300 flex flex-col justify-between select-none opacity-50">
                        <div class="text-sm font-medium">${dayNum}</div>
                    </div>
                `;
            }

            // 渲染當月天數
            const today = new Date();
            for (let i = 1; i <= lastDay; i++) {
                const isToday = (i === today.getDate() && month === today.getMonth() && year === today.getFullYear());
                const isSelected = (i === selectedDate.getDate() && month === selectedDate.getMonth() && year === selectedDate.getFullYear());
                const isSunday = new Date(year, month, i).getDay() === 0;

                const lunar = getLunarInfo(year, month, i);
                const special = getSpecialInfo(year, month, i);

                // 標籤顯示優先順序：節日 > 節氣 > 農曆日
                let badgeText = special.holiday || special.terms || lunar.lunarStr.split(' ')[1];
                let badgeClass = special.holiday ? "text-rose-600 bg-rose-50" : (special.terms ? "text-amber-600 bg-amber-50" : "text-slate-400 bg-slate-50");

                let bgClass = "bg-white/80 hover:bg-indigo-50/50 border-slate-100 hover:border-indigo-200 cursor-pointer shadow-sm";
                if (isToday) {
                    bgClass = "bg-indigo-600 text-white shadow-md shadow-indigo-200 border-indigo-600 hover:bg-indigo-700 cursor-pointer";
                } else if (isSelected) {
                    bgClass = "bg-indigo-50 border-indigo-300 ring-2 ring-indigo-500/20 cursor-pointer";
                }

                daysHTML += `
                    <div onclick="selectDate(${year}, ${month}, ${i})" class="h-20 sm:h-24 p-2 rounded-2xl border transition duration-200 flex flex-col justify-between ${bgClass} group">
                        <div class="flex items-center justify-between">
                            <span class="text-sm sm:text-base font-bold ${isToday ? 'text-white' : (isSunday ? 'text-rose-500' : 'text-slate-800')}">${i}</span>
                            <span class="text-[10px] sm:text-xs px-1.5 py-0.5 rounded-md font-medium truncate max-w-[65px] sm:max-w-[80px] ${isToday ? 'bg-indigo-700 text-white' : badgeClass}">${badgeText}</span>
                        </div>
                        <div class="text-[11px] truncate ${isToday ? 'text-indigo-100' : 'text-slate-500'} font-medium">
                            ${special.holiday ? `<span class="text-rose-500 font-bold">${special.holiday}</span>` : lunar.lunarStr}
                        </div>
                    </div>
                `;
            }

            // 渲染下個月補齊剩餘格數 (維持 6 行共 42 格)
            const totalCellsGenerated = firstDayIndex + lastDay;
            const remainingCells = totalCellsGenerated <= 35 ? (35 - totalCellsGenerated) : (42 - totalCellsGenerated);
            
            for (let i = 1; i <= remainingCells; i++) {
                daysHTML += `
                    <div class="h-20 sm:h-24 p-2 rounded-2xl bg-slate-50/50 border border-transparent text-slate-300 flex flex-col justify-between select-none opacity-50">
                        <div class="text-sm font-medium">${i}</div>
                    </div>
                `;
            }

            daysContainer.innerHTML = daysHTML;
        }

        // 點擊特定日期並更新側邊欄
        function selectDate(year, month, day) {
            selectedDate = new Date(year, month, day);
            renderCalendar(); // 重新渲染以更新選取框外框

            // 填充詳細資訊
            const solarDateStr = `${year} 年 ${month + 1} 月 ${day} 日`;
            document.getElementById('detailSolarDate').textContent = solarDateStr;

            const lunar = getLunarInfo(year, month, day);
            document.getElementById('detailLunarDate').textContent = `農曆 ${lunar.lunarStr}`;

            const special = getSpecialInfo(year, month, day);
            const termTitleElem = document.getElementById('detailTermTitle');
            const termDescElem = document.getElementById('detailTermDesc');

            if (special.holiday || special.terms) {
                termTitleElem.innerHTML = `<i class="fa-solid fa-star text-amber-500"></i><span>節日 / 節氣</span>`;
                termDescElem.textContent = `${special.holiday ? special.holiday + ' ' : ''}${special.terms ? special.terms : ''}`;
            } else {
                termTitleElem.innerHTML = `<i class="fa-solid fa-sun text-amber-500"></i><span>干支紀年</span>`;
                termDescElem.textContent = lunar.ganzhi;
            }

            const yiji = getYiJi(year, month, day);
            document.getElementById('detailYi').textContent = yiji.yi;
            document.getElementById('detailJi').textContent = yiji.ji;

            // 載入該日期的備忘錄
            loadMemo(year, month, day);
        }

        // 取得備忘錄的 LocalStorage Key
        function getMemoKey(year, month, day) {
            return `calendar_memo_${year}_${month}_${day}`;
        }

        // 讀取備忘錄
        function loadMemo(year, month, day) {
            const key = getMemoKey(year, month, day);
            const content = localStorage.getItem(key) || "";
            document.getElementById('memoInput').value = content;
        }

        // 儲存備忘錄
        function saveMemo() {
            const year = selectedDate.getFullYear();
            const month = selectedDate.getMonth();
            const day = selectedDate.getDate();
            const key = getMemoKey(year, month, day);
            const content = document.getElementById('memoInput').value;

            localStorage.setItem(key, content);

            // 顯示已儲存提示
            const status = document.getElementById('memoSaveStatus');
            status.style.opacity = '1';
            setTimeout(() => {
                status.style.opacity = '0';
            }, 1500);
        }

        // 頁面載入初始化
        window.onload = function() {
            initSelectors();
            updateSelectorsValue();
            renderCalendar();
            selectDate(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate());
        };
    </script>
</body>
</html>
