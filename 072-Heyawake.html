:root{
  --paper:#FAF7F0;
  --paper2:#F1EADF;
  --ink:#1A1815;
  --ink2:#5B554A;
  --line:#D8D0BE;
  --verm:#C73E2E;
  --verm2:#E85A3A;
  --gold:#B9975B;
  --surface:#FFFDF8;
  --good:#2E7D5B;
  --bad:#C73E2E;
  --fill:#6B7280;
  --grid-thin:#3B82F6;
  --grid-thick:#1D4ED8;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif
}

button{
  font-family:inherit
}

.app-shell{
  min-height:100vh;
  background:var(--paper);
  padding-top:var(--safe-area-inset-top);
  background-image:radial-gradient(rgba(26,24,21,.035) 1px, transparent 1px);
  background-size:22px 22px
}

.topbar{
  max-width:1280px;
  margin:0 auto;
  padding:18px 22px 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  border-bottom:1px solid var(--line)
}

.brand{
  display:flex;
  gap:14px;
  align-items:center;
  min-width:0
}

.seal{
  width:52px;
  height:52px;
  flex:0 0 52px;
  background:var(--ink);
  color:var(--paper);
  display:grid;
  place-items:center;
  font-family:"Noto Serif TC",serif;
  font-size:30px;
  font-weight:900;
  letter-spacing:.05em;
  transform:rotate(-2deg);
  box-shadow:4px 4px 0 var(--verm)
}

.brand h1{
  margin:0;
  font-family:"Noto Serif TC",serif;
  font-size:clamp(22px,3vw,32px);
  line-height:1;
  letter-spacing:.02em
}

.brand h1 span{
  font-size:.62em;
  font-weight:900;
  margin-left:8px
}

.brand p{
  margin:6px 0 0;
  color:var(--ink2);
  font-size:12px;
  letter-spacing:.12em
}

.top-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:flex-end
}

.btn{
  border:1px solid var(--ink);
  background:var(--surface);
  color:var(--ink);
  border-radius:999px;
  padding:9px 14px;
  font-size:13px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  gap:6px;
  cursor:pointer;
  box-shadow:2px 2px 0 rgba(26,24,21,.12)
}

.btn:hover{
  transform:translate(-1px,-1px);
  box-shadow:3px 3px 0 rgba(26,24,21,.18)
}

.btn:active{
  transform:translate(1px,1px);
  box-shadow:0 0 0 transparent
}

.btn.primary{
  background:var(--ink);
  color:#fff
}

.btn.vermilion{
  background:var(--verm);
  border-color:var(--verm);
  color:#fff
}

.btn.dark{
  background:#2B2722;
  color:#fff
}

.btn.ghost{
  background:transparent
}

.btn.big{
  padding:11px 12px;
  flex:1;
  justify-content:center;
  border-radius:10px
}

.btn em{
  font-style:normal;
  font-weight:500;
  opacity:.8
}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
  transform:none;
  box-shadow:2px 2px 0 rgba(26,24,21,.08)
}

.solve-btn{
  background:#2B2722
}

.spin{
  animation:spin 1s linear infinite
}

@keyframes spin{
  to{
    transform:rotate(360deg)
  }
}

.solve-toggle{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:10px;
  font-size:12.5px;
  font-weight:700;
  cursor:pointer
}

.solve-toggle input{
  accent-color:var(--verm);
  width:15px;
  height:15px
}

.solve-toggle em{
  font-style:normal;
  font-weight:500;
  color:var(--ink2);
  font-size:11.5px
}

.solver-status{
  margin-top:10px;
  border:1px solid var(--line);
  border-radius:8px;
  padding:8px 10px;
  background:var(--paper);
  font-size:12px;
  font-weight:700;
  color:var(--ink2);
  overflow-wrap:anywhere
}

.generating{
  min-height:320px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  text-align:center;
  padding:24px
}

.generating p{
  margin:0;
  color:var(--ink2);
  font-size:13px;
  line-height:1.7;
  max-width:360px;
  overflow-wrap:anywhere
}

.generating strong{
  font-size:16px
}

.solve-progress{
  margin-top:12px;
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px;
  background:var(--paper)
}

.solve-progress-head{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-size:12px;
  font-weight:700
}

.solve-progress-track{
  height:8px;
  background:#E8E0D0;
  border-radius:999px;
  overflow:hidden;
  margin-top:8px
}

.solve-progress-bar{
  height:100%;
  background:var(--verm);
  transition:width .15s
}

.solve-progress-bar.indeterminate{
  animation:slide 1.1s ease-in-out infinite
}

@keyframes slide{
  0%{
    transform:translateX(-100%)
  }

  100%{
    transform:translateX(300%)
  }
}

.solve-progress p{
  margin:8px 0 0;
  color:var(--ink2);
  font-size:11.5px;
  line-height:1.5;
  overflow-wrap:anywhere
}

.step-explain{
  margin-top:12px;
  border:1px solid #BFD9C9;
  background:#EFF8F2;
  border-radius:10px;
  padding:10px 11px
}

.step-explain strong{
  display:flex;
  gap:6px;
  align-items:center;
  font-size:12.5px
}

.step-explain p{
  margin:6px 0 0;
  color:var(--ink2);
  font-size:12.5px;
  line-height:1.65;
  overflow-wrap:anywhere
}

.layout{
  max-width:1280px;
  margin:0 auto;
  display:grid;
  grid-template-columns:360px 1fr;
  gap:0;
  align-items:start
}

.panel{
  padding:24px 22px 28px;
  border-right:1px solid var(--line);
  position:sticky;
  top:var(--safe-area-inset-top);
  align-self:start
}

.eyebrow{
  font-size:11px;
  letter-spacing:.22em;
  font-weight:900;
  color:var(--verm)
}

.panel-head h2{
  font-family:"Noto Serif TC",serif;
  font-size:clamp(28px,3vw,38px);
  line-height:1.15;
  margin:10px 0 10px;
  letter-spacing:.02em
}

.lede{
  color:var(--ink2);
  font-size:14px;
  line-height:1.7;
  margin:0
}

.rules{
  margin:22px 0;
  border-top:1px solid var(--line)
}

.rule{
  display:flex;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid #E8E0D0
}

.rule .n{
  font-family:"Noto Serif TC",serif;
  color:var(--gold);
  font-weight:900;
  font-size:13px
}

.rule strong{
  font-size:14px
}

.rule p{
  margin:4px 0 0;
  color:var(--ink2);
  font-size:12.5px;
  line-height:1.6
}

.rule.highlight{
  background:#FFF1EC;
  margin:0 -10px;
  padding:12px 10px;
  border-color:#F0C4B8
}

.controls{
  margin-top:20px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  box-shadow:4px 4px 0 rgba(26,24,21,.06)
}

.ctrl-label{
  font-size:12px;
  font-weight:800;
  letter-spacing:.12em
}

.diffs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:10px 0 12px
}

.diff{
  border:1px solid var(--line);
  background:var(--paper);
  border-radius:10px;
  padding:10px 6px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  gap:2px;
  align-items:center;
  color:var(--ink)
}

.diff.active{
  background:var(--ink);
  color:#fff;
  border-color:var(--ink)
}

.diff strong{
  font-size:14px
}

.diff span{
  font-size:11px;
  opacity:.75
}

.btn-row{
  display:flex;
  gap:8px;
  margin-bottom:8px
}

.tiny-row{
  display:flex;
  justify-content:space-between;
  margin-top:10px
}

.text-btn{
  border:0;
  background:transparent;
  color:var(--ink2);
  font-size:12px;
  display:inline-flex;
  gap:5px;
  align-items:center;
  cursor:pointer;
  font-weight:600
}

.legend{
  margin-top:16px;
  font-size:12px;
  color:var(--ink2);
  line-height:1.6
}

.legend>div{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap
}

.dot{
  width:18px;
  height:18px;
  display:inline-grid;
  place-items:center;
  border:1px solid var(--grid-thin);
  font-size:14px
}

.dot.black{
  background:var(--fill);
  border-color:var(--grid-thin)
}

.dot.white{
  background:#fff
}

.dot.x{
  background:#fff;
  color:var(--ink)
}

.stage{
  padding:22px 24px 28px;
  min-width:0
}

.stage-top{
  display:flex;
  justify-content:space-between;
  gap:14px;
  flex-wrap:wrap;
  align-items:center
}

.stats{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

.stat{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
  padding:8px 12px;
  min-width:84px
}

.stat span{
  font-size:11px;
  color:var(--ink2);
  display:flex;
  gap:5px;
  align-items:center
}

.stat strong{
  font-size:19px;
  display:block;
  margin-top:2px
}

.stat.bad{
  border-color:#F0B8AC;
  background:#FFF1EC;
  color:var(--bad)
}

.stat.good{
  border-color:#BFD9C9;
  background:#EFF8F2;
  color:var(--good)
}

.puzzle-meta{
  display:flex;
  gap:6px;
  flex-wrap:wrap
}

.tag{
  font-size:11px;
  border:1px solid var(--ink);
  border-radius:999px;
  padding:5px 9px;
  font-weight:700;
  background:var(--surface)
}

.tag.soft{
  background:transparent;
  color:var(--ink2);
  border-color:var(--line)
}

.notice{
  margin-top:14px;
  background:#FFF1EC;
  border:1px solid #F0C4B8;
  border-radius:10px;
  padding:10px 12px;
  display:flex;
  gap:8px;
  align-items:center
}

.notice.win{
  background:#EFF8F2;
  border-color:#BFD9C9
}

.notice p{
  margin:0;
  flex:1;
  font-size:13px;
  font-weight:700;
  overflow-wrap:anywhere
}

.notice button{
  border:0;
  background:transparent;
  cursor:pointer
}

.board-card{
  margin-top:16px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  padding:22px;
  box-shadow:8px 8px 0 rgba(26,24,21,.06);
  display:flex;
  flex-direction:column;
  align-items:center
}

.board-wrap{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  outline:none
}

.board-wrap .grid{
  display:grid;
  background:#fff;
  border:2px solid var(--grid-thick);
  touch-action:none
}

.cell{
  aspect-ratio:1/1;
  width:100%;
  min-width:0;
  padding:0;
  background:#FFFEFA;
  cursor:pointer;
  position:relative;
  display:grid;
  place-items:center;
  transition:background .12s;
  outline:none
}

.cell:hover{
  background:#FFF6E8
}

.cell.is-black{
  background:var(--fill);
  color:#fff
}

.cell.is-black:hover{
  background:#565B64
}

.cell.is-x{
  background:#FFFEFA
}

.cell.is-cursor{
  box-shadow:inset 0 0 0 3px var(--verm);
  z-index:2
}

.cell.is-violation{
  box-shadow:inset 0 0 0 3px var(--bad);
  background:#FFE9E3;
  z-index:1
}

.cell.is-violation.is-black{
  background:#8F2B22
}

.cell.is-hint{
  box-shadow:inset 0 0 0 3px var(--gold)
}

.cell.is-trying{
  box-shadow:inset 0 0 0 3px #C9A227;
  background:#FFF3A6;
  z-index:2
}

.cell.is-trying.is-black{
  background:#C9A227
}

.cell .num{
  font-family:"Noto Serif TC",serif;
  font-weight:900;
  font-size:clamp(15px,2.4vw,22px);
  line-height:1
}

.cell.is-black .num{
  color:#fff
}

.cell .xmark{
  font-size:clamp(18px,3vw,28px);
  font-weight:300;
  color:#8A8375;
  line-height:1
}

.hint-dot{
  position:absolute;
  right:4px;
  top:4px;
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--gold)
}

.board-hint{
  margin:14px 0 0;
  color:var(--ink2);
  font-size:12px;
  text-align:center;
  line-height:1.6;
  overflow-wrap:anywhere
}

.violation-list{
  list-style:none;
  margin:14px 0 0;
  padding:0;
  width:100%;
  max-width:560px;
  display:grid;
  gap:6px
}

.violation-list li{
  display:flex;
  gap:6px;
  align-items:center;
  font-size:13px;
  color:var(--bad);
  background:#FFF1EC;
  border-radius:8px;
  padding:8px 10px;
  overflow-wrap:anywhere
}

.howto-strip{
  margin-top:16px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.howto-strip>div{
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px;
  display:flex;
  gap:10px;
  align-items:flex-start;
  background:rgba(255,255,255,.55)
}

.howto-strip strong{
  font-size:13px;
  display:block
}

.howto-strip p{
  margin:4px 0 0;
  font-size:12px;
  color:var(--ink2);
  line-height:1.6;
  overflow-wrap:anywhere
}

.tutorial{
  margin-top:28px;
  border-top:3px solid var(--grid-thick);
  padding-top:22px
}

.tut-head h3{
  font-family:"Noto Serif TC",serif;
  font-size:clamp(22px,3vw,30px);
  margin:8px 0 8px
}

.tut-head p{
  color:var(--ink2);
  font-size:14px;
  line-height:1.7;
  max-width:720px;
  overflow-wrap:anywhere
}

.tut-grid{
  display:grid;
  grid-template-columns:1fr 320px;
  gap:20px;
  margin-top:18px;
  align-items:start
}

.tut-board{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px
}

.tut-actions{
  display:flex;
  gap:8px;
  align-items:center;
  margin-top:12px;
  flex-wrap:wrap
}

.tut-moves{
  font-size:12px;
  color:var(--ink2);
  margin-left:auto
}

.tut-steps{
  list-style:none;
  margin:0;
  padding:0;
  display:grid;
  gap:0;
  counter-reset:step
}

.tut-steps li{
  padding:14px 0 14px 36px;
  border-bottom:1px solid var(--line);
  position:relative
}

.tut-steps li::before{
  counter-increment:step;
  content:counter(step);
  position:absolute;
  left:0;
  top:13px;
  width:26px;
  height:26px;
  border:1px solid var(--ink);
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:12px;
  font-weight:900;
  background:#fff
}

.tut-steps strong{
  display:block;
  font-size:14px
}

.tut-steps span{
  display:block;
  font-size:12.5px;
  color:var(--ink2);
  line-height:1.6;
  margin-top:4px;
  overflow-wrap:anywhere
}

footer{
  max-width:1280px;
  margin:0 auto;
  border-top:1px solid var(--line);
  padding:16px 22px 26px;
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  color:var(--ink2);
  font-size:12px
}

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(26,24,21,.55);
  display:grid;
  place-items:center;
  padding:18px;
  z-index:50
}

.modal{
  background:var(--paper);
  border:1px solid var(--ink);
  border-radius:18px;
  max-width:560px;
  width:100%;
  padding:26px;
  position:relative;
  box-shadow:10px 10px 0 rgba(0,0,0,.2);
  max-height:90vh;
  overflow:auto
}

.modal-close{
  position:absolute;
  right:14px;
  top:14px;
  border:0;
  background:transparent;
  cursor:pointer
}

.modal h3{
  font-family:"Noto Serif TC",serif;
  font-size:26px;
  margin:8px 0 14px
}

.modal-rules{
  display:grid;
  gap:10px;
  margin-bottom:18px
}

.modal-rules p{
  margin:0;
  font-size:14px;
  line-height:1.7;
  overflow-wrap:anywhere
}

.modal-rules .muted{
  color:var(--ink2);
  font-size:12.5px
}

.win-modal{
  text-align:center
}

.trophy{
  width:64px;
  height:64px;
  margin:0 auto 12px;
  border-radius:50%;
  background:var(--verm);
  color:#fff;
  display:grid;
  place-items:center
}

.win-modal p{
  color:var(--ink2);
  font-size:13px
}

.win-btns{
  display:flex;
  gap:8px;
  justify-content:center;
  margin-top:18px;
  flex-wrap:wrap
}

@media (prefers-color-scheme: dark){
  :root{
    --paper:#1E1B17;
    --paper2:#29251F;
    --ink:#F5EFE4;
    --ink2:#C9BFAE;
    --line:#4A4438;
    --surface:#29251F;
    --verm:#E85A3A;
    --fill:#7A7F87;
    --grid-thin:#60A5FA;
    --grid-thick:#3B82F6
  }

  .app-shell{
    background-image:radial-gradient(rgba(245,239,228,.06) 1px, transparent 1px)
  }

  .seal{
    background:#F5EFE4;
    color:#1E1B17
  }

  .cell{
    background:#2E2A24
  }

  .cell:hover{
    background:#3A352D
  }

  .cell.is-black{
    background:var(--fill)
  }

  .cell.is-black:hover{
    background:#8A909A
  }

  .cell.is-violation{
    background:#4A1A14
  }

  .cell.is-violation.is-black{
    background:#9A3229
  }

  .cell.is-trying.is-black{
    background:#C9A227
  }

  .cell .xmark{
    color:#C9BFAE
  }

  .btn{
    box-shadow:2px 2px 0 rgba(0,0,0,.3)
  }

  .diff.active{
    background:#F5EFE4;
    color:#1E1B17
  }

  .btn.primary{
    background:#F5EFE4;
    color:#1E1B17
  }

  .board-wrap .grid{
    border-color:var(--grid-thick)
  }

  .rule.highlight{
    background:#3A1E18
  }

  .notice{
    background:#3A1E18
  }

  .violation-list li{
    background:#3A1E18
  }
}

@media (max-width: 860px){
  .layout{
    grid-template-columns:1fr
  }

  .panel{
    position:static;
    border-right:0;
    border-bottom:1px solid var(--line);
    padding:18px 16px 20px
  }

  .stage{
    padding:16px
  }

  .topbar{
    padding:14px 16px;
    align-items:flex-start
  }

  .top-actions{
    flex-direction:column;
    align-items:flex-end
  }

  .board-card{
    padding:12px
  }

  .howto-strip{
    grid-template-columns:1fr
  }

  .tut-grid{
    grid-template-columns:1fr
  }

  .brand p{
    display:none
  }

  .seal{
    width:44px;
    height:44px;
    flex-basis:44px;
    font-size:26px
  }

  footer{
    padding:14px 16px 22px
  }
}

@media (max-width: 480px){
  .btn{
    padding:8px 10px;
    font-size:12px
  }

  .stat{
    min-width:72px;
    padding:7px 9px
  }

  .stat strong{
    font-size:16px
  }

  .top-actions .btn{
    width:100%;
    justify-content:center
  }

  .board-card{
    padding:8px
  }

  .modal{
    padding:20px
  }
}
