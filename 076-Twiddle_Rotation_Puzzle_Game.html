:root{
  --bg:#fff8ed;
  --surface:#ffffff;
  --surface2:#fff0d9;
  --ink:#202126;
  --muted:#6d6a65;
  --line:#eadfd1;
  --accent:#ff5d8f;
  --blue:#4dabf7;
  --green:#37b24d
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Sans TC",system-ui,sans-serif
}

button{
  font:inherit
}

button:focus-visible{
  outline:3px solid #4dabf7;
  outline-offset:2px
}

.shell{
  min-height:100vh;
  padding-top:var(--safe-area-inset-top);
  padding-bottom:40px;
  background:radial-gradient(circle at 15% 5%,#ffe8a8 0,transparent 32%),radial-gradient(circle at 90% 20%,#ffd0dd 0,transparent 30%),var(--bg)
}

.topbar{
  max-width:1180px;
  margin:auto;
  padding:20px 22px 0;
  display:flex;
  justify-content:space-between;
  align-items:center
}

.brand{
  display:flex;
  gap:12px;
  align-items:center
}

.logo{
  width:46px;
  height:46px;
  border-radius:14px;
  background:linear-gradient(135deg,#ff5d8f,#ff922b);
  display:grid;
  place-items:center;
  color:#fff;
  font-size:28px;
  font-weight:900;
  box-shadow:0 8px 20px #ff8e7d55
}

.brand strong{
  display:block;
  font-family:"Baloo 2",sans-serif;
  font-size:22px;
  letter-spacing:2px;
  line-height:1
}

.brand small{
  color:var(--muted);
  font-size:12px
}

.how-btn{
  border:1px solid var(--line);
  background:var(--surface);
  padding:10px 15px;
  border-radius:999px;
  font-weight:700;
  cursor:pointer
}

.header-actions{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  justify-content:flex-end
}

.sound-control{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:999px;
  padding:5px 10px 5px 5px
}

.sound-toggle{
  display:flex;
  align-items:center;
  gap:6px;
  border:0;
  background:transparent;
  padding:7px 10px;
  border-radius:999px;
  font-weight:800;
  cursor:pointer;
  color:var(--muted)
}

.sound-toggle.on{
  background:#202126;
  color:#fff
}

.sound-volume{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:12px;
  font-weight:800;
  color:var(--muted);
  white-space:nowrap
}

.sound-volume input{
  width:90px;
  accent-color:#ff5d8f;
  cursor:pointer
}

.sound-volume input:disabled{
  opacity:.45;
  cursor:not-allowed
}

.sound-volume b{
  min-width:36px;
  text-align:right;
  color:var(--ink)
}

@media(max-width:760px){
  .header-actions{
    max-width:240px
  }

  .sound-volume input{
    width:70px
  }
}

main{
  max-width:1180px;
  margin:auto;
  padding:18px 22px 0
}

.hero{
  max-width:760px
}

.eyebrow{
  color:#e6492d;
  font-weight:900;
  letter-spacing:1.5px;
  font-size:13px;
  margin:8px 0
}

.hero h1{
  font-size:clamp(38px,7vw,72px);
  line-height:1.02;
  letter-spacing:-.04em;
  margin:0;
  font-weight:900
}

.hero h1 span{
  color:transparent;
  background:linear-gradient(90deg,#ff5d8f,#ff922b,#4dabf7);
  -webkit-background-clip:text;
  background-clip:text
}

.lede{
  font-size:17px;
  line-height:1.7;
  color:#55504c;
  max-width:700px
}

.difficulty{
  display:flex;
  gap:10px;
  margin:22px 0 28px;
  flex-wrap:wrap
}

.difficulty button{
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:15px;
  padding:11px 18px;
  cursor:pointer;
  display:flex;
  gap:8px;
  align-items:center;
  box-shadow:0 3px 0 #eee
}

.difficulty button.active{
  background:#202126;
  color:#fff;
  border-color:#202126
}

.difficulty button span{
  font-size:12px;
  opacity:.75
}

.play-area{
  display:grid;
  grid-template-columns:minmax(0,1.35fr) minmax(280px,.75fr);
  gap:26px;
  align-items:start
}

.board-col{
  min-width:0
}

.board-head{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  color:var(--muted);
  margin-bottom:12px
}

.live-dot{
  display:inline-block;
  width:9px;
  height:9px;
  border-radius:50%;
  background:#ff5d8f;
  margin-right:6px;
  box-shadow:0 0 0 5px #ff5d8f22
}

.board-wrap{
  max-width:620px
}

.board{
  position:relative;
  width:100%;
  aspect-ratio:1;
  background:#27232b;
  border-radius:28px;
  padding:10px;
  box-shadow:0 24px 55px #422d3a28, inset 0 0 0 4px #fff2;
  border:6px solid #fff;
  overflow:hidden
}

.tile{
  position:absolute;
  padding:5px;
  transition:box-shadow .2s
}

.tile span{
  width:100%;
  height:100%;
  border-radius:19px;
  display:grid;
  place-items:center;
  color:#fff;
  font-family:"Baloo 2",sans-serif;
  font-size:clamp(32px,8vw,62px);
  font-weight:800;
  text-shadow:0 3px 0 #0002;
  box-shadow:inset 0 -7px 0 #0002,0 7px 14px #0003
}

.tile.correct span{
  box-shadow:inset 0 -7px 0 #0002,0 0 0 3px #fff,0 7px 14px #0003
}

.tile i{
  position:absolute;
  right:13px;
  top:9px;
  background:#fff;
  color:#2b8a3e;
  border-radius:50%;
  width:22px;
  height:22px;
  display:grid;
  place-items:center;
  font-size:13px;
  font-style:normal;
  font-weight:900
}

.block-zone{
  position:absolute;
  width:66.6666%;
  height:66.6666%;
  border-radius:22px;
  z-index:10;
  border:2px dashed transparent;
  cursor:pointer;
  transition:.18s
}

.block-zone:hover,.block-zone:focus-within{
  background:#ffffff26;
  border-color:#fff;
  box-shadow:inset 0 0 0 3px #ffffff44
}

.zone-label{
  position:absolute;
  left:10px;
  top:8px;
  color:#fff;
  background:#0008;
  padding:3px 8px;
  border-radius:999px;
  font-size:11px;
  opacity:0
}

.block-zone:hover .zone-label{
  opacity:1
}

.zone-actions{
  position:absolute;
  right:9px;
  bottom:9px;
  display:flex;
  gap:6px;
  opacity:0;
  transform:translateY(4px);
  transition:.18s
}

.block-zone:hover .zone-actions,.block-zone:active .zone-actions{
  opacity:1;
  transform:none
}

.zone-actions button{
  width:42px;
  height:42px;
  border-radius:50%;
  border:0;
  background:#fff;
  font-size:22px;
  cursor:pointer;
  box-shadow:0 5px 14px #0004
}

.board-caption{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin:12px 0
}

.touch-toggle{
  display:flex;
  gap:8px;
  align-items:center;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:8px;
  max-width:620px
}

.touch-toggle>span{
  font-size:13px;
  color:var(--muted);
  padding-left:5px
}

.touch-toggle button{
  border:0;
  background:transparent;
  padding:8px 12px;
  border-radius:9px;
  cursor:pointer;
  font-weight:700
}

.touch-toggle button.on{
  background:#202126;
  color:#fff
}

.controls{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-top:12px;
  max-width:620px
}

.controls button,.modal-actions button{
  display:flex;
  align-items:center;
  gap:7px;
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:12px;
  padding:11px 14px;
  font-weight:700;
  cursor:pointer
}

.controls button:disabled{
  opacity:.45;
  cursor:not-allowed
}

.controls .primary,.modal-actions .primary{
  background:linear-gradient(135deg,#ff5d8f,#ff922b);
  color:#fff;
  border:0
}

.hint-btn{
  color:#7a5c00
}

.notice{
  background:#fff3bf;
  border:1px solid #fab005;
  border-radius:12px;
  padding:11px 13px;
  margin-top:12px;
  display:flex;
  gap:8px;
  align-items:center;
  font-size:14px;
  max-width:620px
}

.quick-blocks{
  margin-top:20px;
  max-width:620px
}

.quick-blocks>p{
  font-size:13px;
  color:var(--muted);
  margin:0 0 8px
}

.quick-blocks>div{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}

.quick-blocks>div>div{
  display:flex;
  align-items:center;
  gap:6px;
  background:var(--surface);
  border:1px solid var(--line);
  padding:8px;
  border-radius:12px
}

.quick-blocks>div>div>span{
  font-weight:800;
  font-size:13px;
  min-width:32px
}

.quick-blocks button{
  border:0;
  background:var(--surface2);
  padding:7px 8px;
  border-radius:8px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:4px;
  font-size:12px
}

.auto-box{
  max-width:620px;
  margin-top:12px;
  background:linear-gradient(135deg,#fff0d9,#ffe3ec);
  border:1px solid #ffc9d6;
  border-radius:16px;
  padding:13px 14px
}

.auto-row{
  display:flex;
  align-items:center;
  gap:9px;
  flex-wrap:wrap
}

.auto-main{
  display:flex;
  align-items:center;
  gap:8px;
  border:0;
  border-radius:12px;
  padding:12px 16px;
  font-weight:900;
  cursor:pointer;
  color:#fff;
  background:linear-gradient(135deg,#ff5d8f,#ff922b);
  box-shadow:0 8px 18px #ff5d8f33
}

.auto-main:disabled{
  opacity:.6;
  cursor:wait
}

.auto-stop{
  display:flex;
  align-items:center;
  gap:6px;
  border:1px solid var(--line);
  background:var(--surface);
  border-radius:11px;
  padding:10px 13px;
  font-weight:800;
  cursor:pointer
}

.auto-speed{
  font-size:13px;
  font-weight:800;
  color:#8a4a00;
  background:#fff;
  border-radius:999px;
  padding:5px 10px
}

.auto-status{
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-weight:800;
  font-size:14px;
  margin:12px 2px 7px
}

.auto-progress{
  height:10px;
  border-radius:999px;
  background:#ffffffb8;
  overflow:hidden
}

.auto-progress i{
  display:block;
  height:100%;
  border-radius:inherit;
  background:linear-gradient(90deg,#ff5d8f,#ff922b,#4dabf7);
  transition:width .35s ease
}

.auto-next,.auto-hint{
  margin:8px 2px 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.5
}

.block-zone.auto-highlight{
  background:#ffd43b33;
  border-color:#ffd43b;
  box-shadow:inset 0 0 0 3px #ffd43b,0 0 0 4px #ffd43b55
}

.block-zone.auto-highlight .zone-label{
  opacity:1;
  background:#ffd43b;
  color:#202126
}

  opacity:.45;

}

.side{
  display:flex;
  flex-direction:column;
  gap:15px;
  position:sticky;
  top:calc(var(--safe-area-inset-top) + 12px)
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px
}

.stats>div{
  background:#202126;
  color:#fff;
  border-radius:16px;
  padding:14px;
  min-width:0
}

.stats svg{
  color:#ffd43b
}

.stats label{
  display:block;
  color:#bbb;
  font-size:12px;
  margin:5px 0 2px
}

.stats strong{
  display:block;
  font-size:clamp(18px,2.5vw,24px);
  overflow-wrap:anywhere
}

.best-box,.reference,.history-box{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px
}

.best-title{
  display:flex;
  gap:8px;
  align-items:center;
  font-weight:800;
  margin-bottom:12px;
  flex-wrap:wrap
}

.best-title small{
  font-weight:400;
  color:var(--muted);
  font-size:11px
}

.best-box>div:not(.best-title){
  display:flex;
  justify-content:space-between;
  padding:9px 10px;
  border-radius:10px;
  font-size:14px
}

.best-box .current{
  background:#fff0d9
}

.reference>div:first-child{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:800
}

.reference small{
  color:var(--muted);
  font-weight:400
}

.mini{
  display:grid;
  grid-template-columns:repeat(9,1fr);
  gap:5px;
  margin-top:11px
}

.mini span{
  aspect-ratio:1;
  border-radius:7px;
  display:grid;
  place-items:center;
  color:#fff;
  font-weight:800;
  font-size:14px
}

.history-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:800
}

.history-head span{
  display:flex;
  gap:7px;
  align-items:center
}

.history-head em{
  font-style:normal;
  color:var(--muted);
  font-size:13px
}

.history-box ol{
  padding-left:20px;
  margin:12px 0 0;
  line-height:1.8;
  font-size:14px
}

.empty{
  color:var(--muted);
  font-size:14px;
  line-height:1.6
}

.history-box>small{
  color:var(--muted)
}

.how{
  margin-top:38px;
  background:#202126;
  color:#fff;
  border-radius:24px;
  padding:28px
}

.how h2{
  font-size:30px;
  margin:0 0 20px
}

.how>div{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px
}

.how article{
  border-top:1px solid #ffffff33;
  padding-top:14px
}

.how article>b{
  color:#ffd43b;
  font-family:"Baloo 2"
}

.how h3{
  margin:8px 0
}

.how p{
  color:#d6d6d6;
  line-height:1.7
}

.how .tip{
  margin:22px 0 0;
  background:#ffffff14;
  border-radius:12px;
  padding:13px 15px;
  color:#fff
}

.modal-wrap{
  position:fixed;
  inset:0;
  overflow-y:auto;
  padding-top:max(1rem,var(--safe-area-inset-top));
  padding-bottom:1rem;
  background:#100f16cc;
  backdrop-filter:blur(4px);
  z-index:50;
  animation:modalFadeIn .25s ease-out both
}

.modal-center{
  min-height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  z-index:1
}

.modal{
  position:relative;
  z-index:1;
  width:min(480px,calc(100% - 32px));
  background:var(--surface);
  border-radius:26px;
  padding:30px;
  text-align:center;
  box-shadow:0 30px 80px #0007;
  overflow:hidden;
  transform:none;
  animation:modalCalmIn .3s ease-out both
}

.trophy{
  font-size:56px
}

.win-kicker{
  letter-spacing:3px;
  color:#e6492d;
  font-weight:900;
  font-size:12px
}

.modal h2{
  font-size:38px;
  margin:4px 0
}

.win-sub{
  color:var(--muted)
}

.win-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:20px 0
}

.win-stats>div{
  background:var(--surface2);
  border-radius:15px;
  padding:13px
}

.win-stats span{
  display:block;
  font-size:12px;
  color:var(--muted)
}

.win-stats strong{
  font-size:24px
}

.solved-line{
  font-weight:700
}

.modal-actions{
  display:flex;
  justify-content:center;
  gap:10px
}

.confetti{
  position:absolute;
  inset:0;
  z-index:0;
  overflow:hidden;
  pointer-events:none
}

.confetti i{
  position:absolute;
  top:-20px;
  width:9px;
  height:15px;
  opacity:0;
  animation:confettiFall 2.6s ease-in 1 forwards;
  will-change:transform,opacity
}

.confetti i:nth-child(odd){
  border-radius:50%
}

@keyframes modalFadeIn{
  from{
    opacity:0
  }

  to{
    opacity:1
  }
}

@keyframes modalCalmIn{
  from{
    opacity:0;
    transform:scale(.96) translateY(8px)
  }

  to{
    opacity:1;
    transform:scale(1) translateY(0)
  }
}

@keyframes confettiFall{
  0%{
    transform:translateY(0) rotate(0deg);
    opacity:0
  }

  12%{
    opacity:.9
  }

  100%{
    transform:translateY(680px) rotate(540deg);
    opacity:0
  }
}

@media(prefers-reduced-motion:reduce){
  .modal-wrap,.modal,.confetti i{
    animation:none!important
  }

  .modal,.confetti i{
    opacity:1;
    transform:none
  }
}

.modal-actions{
  position:relative;
  z-index:2
}

.modal-actions button{
  pointer-events:auto;
  position:relative;
  z-index:2
}

@media(max-width:760px){
  .play-area{
    grid-template-columns:1fr
  }

  .side{
    position:static
  }

  .topbar{
    padding-left:14px;
    padding-right:14px
  }

  main{
    padding-left:14px;
    padding-right:14px
  }

  .how{
    padding:22px
  }

  .how>div{
    grid-template-columns:1fr
  }

  .board{
    border-radius:22px
  }

  .zone-actions{
    opacity:1;
    transform:none
  }

  .zone-label{
    opacity:1
  }

  .quick-blocks>div{
    grid-template-columns:1fr 1fr
  }

  .controls button{
    flex:1 1 40%;
    justify-content:center
  }

  .stats>div{
    padding:11px
  }
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#17151b;
    --surface:#26222c;
    --surface2:#38302f;
    --ink:#fff7ef;
    --muted:#c5bec1;
    --line:#453e45
  }

  .shell{
    background:radial-gradient(circle at 15% 5%,#4b341a 0,transparent 32%),radial-gradient(circle at 90% 20%,#4f243a 0,transparent 30%),var(--bg)
  }

  .difficulty button.active,.touch-toggle button.on{
    background:#fff;
    color:#111
  }

  .lede{
    color:#d2c9ca
  }

  .board{
    border-color:#3d3542
  }

  .how{
    background:#100e13
  }

  .controls button,.how-btn,.quick-blocks>div>div{
    background:var(--surface)
  }
}
