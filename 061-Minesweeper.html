  }

  }

  50% {
    transform: translateY(-5px);
  }
}

.confetti-layer {
  overflow: hidden;
}

.confetti-fall {
  position: absolute;
  top: -28px;
  will-change: transform, opacity;
  animation-name: confetti-fall;
  animation-timing-function: cubic-bezier(.22, .55, .42, 1);
  animation-fill-mode: both;
}

.confetti-piece {
  display: block;
  will-change: transform;
  animation-name: confetti-tumble;
  animation-timing-function: ease-in-out;
  animation-iteration-count: infinite;
}

@keyframes confetti-fall {
  0% {
    transform: translate3d(0, -4vh, 0);
    opacity: 0;
  }

  6% {
    opacity: 1;
  }

  82% {
    opacity: 1;
  }

  100% {
    transform: translate3d(var(--drift, 0px), 108vh, 0);
    opacity: 0;
  }
}

@keyframes confetti-tumble {
  0% {
    transform: translateX(0) rotate(0deg) scaleX(1);
  }

  25% {
    transform: translateX(var(--sway, 10px)) rotate(140deg) scaleX(.55);
  }

  50% {
    transform: translateX(calc(var(--sway, 10px) * -1)) rotate(260deg) scaleX(1);
  }

  75% {
    transform: translateX(var(--sway, 10px)) rotate(390deg) scaleX(.6);
  }

  100% {
    transform: translateX(0) rotate(520deg) scaleX(1);
  }
}

@media (prefers-reduced-motion: reduce) {
  .confetti-layer {

}
